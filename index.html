<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Daum 커뮤니티 2기 · 내 활동 조회</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{--ink:#211C33;--purple:#6B5FC7;--purple-deep:#4A3FA8;--paper:#F7F6FB;--surface:#fff;--lilac:#EEEBFA;--line:#E4E0F0;--muted:#6E6885}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 40px}
header{background:linear-gradient(150deg,#5B4FBF,#3A3086);color:#fff;padding:26px 0 22px}
header .eyebrow{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.7);margin:0 0 6px}
header h1{margin:0;font-size:23px;font-weight:800}header .meta{font-size:13px;color:rgba(255,255,255,.85);margin-top:8px}
.login{max-width:400px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 10px 34px rgba(74,63,168,.12)}
.login h2{margin:0 0 4px;font-size:19px;color:var(--purple-deep)}.login p{margin:0 0 18px;font-size:13px;color:var(--muted)}
.login label{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin:12px 0 5px}
.login input{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;outline:none}
.login input:focus{border-color:var(--purple)}
.login button{width:100%;margin-top:18px;background:var(--purple);color:#fff;border:none;border-radius:11px;padding:12px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.err{color:#C0392B;font-size:13px;margin-top:12px;min-height:18px;font-weight:700}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:800;color:#fff}.pill.sm{font-size:11px;padding:1px 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted);font-weight:700}.tile .v{font-size:28px;font-weight:800;margin-top:4px}.tile .s{font-size:11px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}.card h2{font-size:15px;margin:0 0 12px;color:var(--purple-deep)}
.prog{margin:10px 0}.prog .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar{height:12px;border-radius:7px;background:#F0EEF7;overflow:hidden}.bar .f{height:100%;border-radius:7px;background:var(--purple)}.bar .f.done{background:#2E9E6B}
.mini{display:flex;height:14px;border-radius:5px;overflow:hidden;background:#eee;margin:8px 0}.mini span{height:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.badges .dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--lilac);color:var(--muted);font-size:12px}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.post{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}.post .dt{color:#898781;font-size:11.5px;width:40px;flex:none}.post .ti{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--lilac);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--purple-deep)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}.topbar button{background:#fff;color:var(--purple);border:1.5px solid var(--purple);border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer;font-family:inherit}
footer{color:var(--muted);font-size:11.5px;text-align:center;padding:14px}
</style></head><body>

const META = {"period": "2026-08-10 ~ 2026-08-15", "dates": ["2026-08-10", "2026-08-11", "2026-08-12", "2026-08-13", "2026-08-14", "2026-08-15"], "currentWeek": "8/10~8/16"};
const CC={"스포츠":"#2a78d6","연예":"#eb6834","경제":"#1baf7a","라이프":"#eda100","일반/기타":"#898781","미배정":"#B9B2D9"};
const CATS=["스포츠","연예","경제","라이프","일반/기타"], MPOST=7, MREPLY=15;
document.getElementById('hmeta').textContent=`활동 기간 ${META.period}`;
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function b64d(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function sha256hex(str){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function normNick(n){return n.trim().replace(/\s+/g,'').toLowerCase();}
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function tryLogin(){
  const err=document.getElementById('err'); err.textContent='';
  const nick=document.getElementById('nick').value, pw=document.getElementById('pw').value;
  if(!nick||!pw){err.textContent='닉네임과 비밀번호를 입력하세요.';return;}
  const key=await sha256hex(normNick(nick));
  const rec=ENC[key];
  if(!rec){err.textContent='닉네임을 찾을 수 없어요. 철자를 확인해 주세요.';return;}
  try{
    const k=await deriveKey(pw,b64d(rec.s));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(rec.i)},k,b64d(rec.c));
    const data=JSON.parse(new TextDecoder().decode(pt));
    render(data);
  }catch(e){ err.textContent='비밀번호가 올바르지 않아요.'; }
}
function render(d){
  document.getElementById('loginBox').style.display='none';
  const box=document.getElementById('report'); box.style.display='block';
  const by=d.byContent, tot=CATS.reduce((s,k)=>s+(by[k]||0),0)||1;
  const mini='<div class="mini">'+CATS.filter(k=>by[k]>0).map(k=>`<span style="width:${by[k]/tot*100}%;background:${CC[k]}"></span>`).join('')+'</div>';
  const badges='<div class="badges">'+CATS.filter(k=>by[k]>0).map(k=>`<span><span class="dot" style="background:${CC[k]}"></span>${k} <b>${by[k]}</b></span>`).join('')+'</div>';
  const off=CATS.filter(k=>k!==d.assigned).reduce((s,k)=>s+(by[k]||0),0);
  const offnote=(off&&CATS.includes(d.assigned))?`<div class="note" style="margin-top:8px">배정 토픽(${d.assigned}) 외 주제로 분류된 원글이 ${off}건 있어요. (내용 자동분석 참고값)</div>`:'';
  const ppost=Math.round(Math.min(100,d.posts/MPOST*100)), preply=Math.round(Math.min(100,d.replies/MREPLY*100));
  const dates=META.dates;
  const dhead=dates.map(x=>`<th class="num">${x.slice(5)}</th>`).join('');
  const drp=dates.map(x=>`<td class="num">${(d.daily[x]||{}).post||0}</td>`).join('');
  const drr=dates.map(x=>`<td class="num">${(d.daily[x]||{}).reply||0}</td>`).join('');
  const plist=d.postlist.length?d.postlist.map(p=>`<div class="post"><span class="dt">${p.date.slice(5)}</span>
    <a class="ti" href="${p.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(p.title)||'(제목 없음)'} <span style="color:var(--purple);font-size:11px">↗</span></a>
    <span class="pill sm" style="background:${CC[p.content]}">${p.content}</span></div>`).join(''):'<div class="note">원글이 없어요.</div>';
  // 주차별 미션·개근 스트립
  const weeks=(d.weeks||[]);
  const weekRows=weeks.length?weeks.map(w=>{
    const cur=!w.complete;
    const mCell=w.mission?'<b style="color:#2E8B57">✅ 달성</b>':(w.complete?'<span style="color:#C0392B">⬜ 미달성</span>':`<span style="color:var(--muted)">진행중 (원글 ${w.posts}/${MPOST}·답글 ${w.replies}/${MREPLY})</span>`);
    const gCell=w.complete?(w.geun?'<b style="color:var(--purple-deep)">🎯 개근</b>':'<span style="color:var(--muted)">개근 아님</span>')
      :`<span style="color:var(--muted)">마감 후 확정 (활동 ${w.activeDays}/${w.daysElapsed}일)</span>`;
    return `<tr><td><b>${w.label}</b>${cur?' <span class="pill sm" style="background:var(--purple)">이번주</span>':''}</td><td>${mCell}</td><td>${gCell}</td></tr>`;
  }).join(''):'<tr><td colspan="3" style="color:var(--muted)">아직 집계된 주차가 없어요.</td></tr>';

  box.innerHTML=`<div class="topbar"><div><span class="pill sm" style="background:${CC[d.assigned]||'#888'}">${d.assigned}</span> <b style="font-size:18px;margin-left:6px">${esc(d.nick)}</b></div><button onclick="location.reload()">로그아웃</button></div>
    <div class="note" style="margin-bottom:14px">이 페이지는 <b>탐색·참고용</b>이에요. 카테고리 자동분석·집계에 오류가 있을 수 있고, 업데이트가 늦거나 건너뛸 수 있어요. 공식 기준·정산·수상은 <b>카페 공지</b>를 따라주세요.</div>
    <div class="tiles">
      <div class="tile"><div class="k">이번 주 원글</div><div class="v">${d.posts}</div><div class="s">건</div></div>
      <div class="tile"><div class="k">이번 주 답글</div><div class="v">${d.replies}</div><div class="s">건</div></div>
      <div class="tile"><div class="k">활동일</div><div class="v">${d.activeDays}</div><div class="s">/ ${dates.length}일</div></div></div>
    <div class="card"><h2>주차별 미션 · 개근</h2>
      <div style="overflow-x:auto"><table><thead><tr><th>주차</th><th>주간 미션</th><th>개근</th></tr></thead><tbody>${weekRows}</tbody></table></div>
      <div class="note" style="margin-top:10px">주간 미션 = 원글 7건 + 답글 15건. 개근 = 그 주 <b>7일 모두 활동(원글 또는 답글 1건 이상)</b> + 주간 미션 달성. (투표형 2건 요건은 이 화면에서 확인 못 해요 — 별도 확인)</div></div>
    <div class="card"><h2>이번 주 미션 진행</h2>
      <div class="prog"><div class="row"><span>원글 ${d.posts} / ${MPOST}건</span><span>${ppost}%</span></div><div class="bar"><div class="f ${d.posts>=MPOST?'done':''}" style="width:${ppost}%"></div></div></div>
      <div class="prog"><div class="row"><span>답글 ${d.replies} / ${MREPLY}건</span><span>${preply}%</span></div><div class="bar"><div class="f ${d.replies>=MREPLY?'done':''}" style="width:${preply}%"></div></div></div>
      <div class="note">※ 미션 기준: 원글 7건(투표형 2건 포함) · 답글 15건 / 주. 투표형·반응 지표는 주간 집계 후 반영됩니다.</div></div>
    <div class="card"><h2>내 원글, 어떤 주제였나</h2>${d.postlist.length?mini+badges+offnote:'<div class="note">아직 원글이 없어요.</div>'}</div>
    <div class="card"><h2>일자별 활동</h2><div style="overflow-x:auto"><table><thead><tr><th>날짜</th>${dhead}</tr></thead><tbody><tr><td>원글</td>${drp}</tr><tr><td>답글</td>${drr}</tr></tbody></table></div></div>
    <div class="card"><h2>내 원글 목록 <span style="font-weight:600;color:var(--muted);font-size:12px">(${d.postlist.length}건)</span></h2>${plist}</div>
    <div class="card"><h2>리워드 한눈에 (쉽게)</h2>
      <div style="font-size:13.5px;line-height:1.9">
        <b>① 기본급</b> — 매주 미션(원글 7·답글 15) 달성하면 그 주 인정, 월 단위로 정산돼요.<br>
        <b>② 격주 리그</b> — 2주마다 카테고리별 성과로 <b>S·A·B 등급</b> 시상. <span style="color:var(--muted)">등급·순위는 반응 데이터(받은 댓글·투표)가 반영된 뒤 <b>카페 공지</b>로 안내돼요. 이 화면엔 아직 안 나와요.</span><br>
        <b>③ 격주 특별상</b> — 활동 총량이 많은 분께 (댓글소환왕·구조대왕·투표설계자 등).<br>
        <b>④ 럭키 개근상</b> — 한 주 7일 모두 활동 + 미션 달성자 대상 추첨.<br>
        <b>⑤ 시즌 어워즈</b> — 시즌 전체 성과 1·2·3등.
      </div>
      <div class="note" style="margin-top:10px">위 표의 '주간 미션'과 '개근'은 ①·④의 참고 지표예요. 실제 수상·정산은 반응 데이터와 정성 평가까지 반영해 <b>운영진이 최종 확정</b>합니다.</div></div>`;
}
document.getElementById('go').onclick=tryLogin;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
