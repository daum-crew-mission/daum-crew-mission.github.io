6px\">외부 답글</div></div>\n</div>\n<div class=\"note warn\">전주 대비: 원글 3,736→3,400(<b>▼9%</b>) · 크루답글 22,030→19,980(<b>▼9%</b>) · 조회 763,097→550,896(<b>▼28%</b>) · 투표 10,684→6,106(<b>▼43%</b>) · 외부답글 1,779→647(<b>▼64%</b>) · 외부좋아요 2,077→1,744(▼16%). 5주차엔 외부반응만 빠졌지만 <b>6주차는 크루 생산·내부답글까지 처음으로 동반 하락</b> — 노출 부재 장기화의 크루 사기 영향으로 해석.</div>\n\n<div class=\"sec\">🔎 홈피드 슬롯 제거 — MCP 검증 (bada 로그인 조회 이벤트, 일별)</div>\n<div class=\"card\"><h3>일별 로그인 조회수 (전체 콘텐츠) — 9/3~9/4 반토막 후 미회복</h3>\n<div class=\"daily\">\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:104px;background:#6B5FC7\"></div><div class=\"dl\">8/24</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:101px;background:#6B5FC7\"></div><div class=\"dl\">8/25</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:130px;background:#6B5FC7\"></div><div class=\"dl\">8/26</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:115px;background:#6B5FC7\"></div><div class=\"dl\">8/27</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:93px;background:#6B5FC7\"></div><div class=\"dl\">8/28</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:96px;background:#6B5FC7\"></div><div class=\"dl\">8/29</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:93px;background:#6B5FC7\"></div><div class=\"dl\">8/30</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:89px;background:#6B5FC7\"></div><div class=\"dl\">8/31</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:74px;background:#6B5FC7\"></div><div class=\"dl\">9/1</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:85px;background:#6B5FC7\"></div><div class=\"dl\">9/2</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:47px;background:#C0392B\"></div><div class=\"dl\">9/3</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:29px;background:#C0392B\"></div><div class=\"dl\">9/4</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:32px;background:#eb6834\"></div><div class=\"dl\">9/5</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:32px;background:#eb6834\"></div><div class=\"dl\">9/6</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:31px;background:#eb6834\"></div><div class=\"dl\">9/7</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:30px;background:#eb6834\"></div><div class=\"dl\">9/8</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:30px;background:#eb6834\"></div><div class=\"dl\">9/9</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:28px;background:#eb6834\"></div><div class=\"dl\">9/10</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:30px;background:#eb6834\"></div><div class=\"dl\">9/11</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:30px;background:#eb6834\"></div><div class=\"dl\">9/12</div></div>\n<div class=\"dcol\"><div class=\"dbar\" style=\"height:38px;background:#eb6834\"></div><div class=\"dl\">9/13</div></div>\n</div>\n<div class=\"note info\" style=\"margin-top:10px\"><b>bada.view MCP 조회 결과</b> — 일별 로그인 조회수(고유 조회자): 9/2 <b>99,215(34,150명)</b> → 9/3 54,932 → 9/4 <b>33,574(14,627명)</b>로 <b>이틀 만에 −66%</b>. 이후 9/5~9/13 내내 33k~37k(고유 14k~16k)에 고착, 9/13에 44k로 소폭 반등했으나 제거 전(100k+)의 <b>절반 이하</b>. <b>\"주말에 형태를 바꿔 슬롯이 복귀했지만 노출은 회복되지 않았다\"가 데이터로 확증</b> — 조회의 붕괴 시점(9/3~4)이 슬롯 제거 시점과 정확히 일치.</div></div>\n\n<div class=\"sec\">카테고리별 외부 반응 구조 (6주차 원글)</div>\n<div class=\"card\"><h3>외부답글 기여 — 라이프·연예로 이동, 경제 급감</h3>\n<div class=\"cbar\"><div class=\"cl2\">라이프</div><div class=\"ct\"><div class=\"cf\" style=\"width:100%;background:#eda100\"></div></div><div style=\"font-size:12px;text-align:right\">235 · 2.43</div></div>\n<div class=\"cbar\"><div class=\"cl2\">연예</div><div class=\"ct\"><div class=\"cf\" style=\"width:66%;background:#eb6834\"></div></div><div style=\"font-size:12px;text-align:right\">154 · 0.84</div></div>\n<div class=\"cbar\"><div class=\"cl2\">경제</div><div class=\"ct\"><div class=\"cf\" style=\"width:53%;background:#1baf7a\"></div></div><div style=\"font-size:12px;text-align:right\">125 · 0.90</div></div>\n<div class=\"cbar\"><div class=\"cl2\">일반/기타</div><div class=\"ct\"><div class=\"cf\" style=\"width:30%;background:#898781\"></div></div><div style=\"font-size:12px;text-align:right\">70 · 0.86</div></div>\n<div class=\"cbar\"><div class=\"cl2\">스포츠</div><div class=\"ct\"><div class=\"cf\" style=\"width:27%;background:#2a78d6\"></div></div><div style=\"font-size:12px;text-align:right\">63 · 1.24</div></div>\n<div class=\"note info\" style=\"margin-top:10px\">막대 옆 숫자 = 외부답글 수 · 전환율(외부답글/1k조회). <b>경제가 5주차 706(40%)에서 6주차 125로 급감</b> — 정치·정책 이슈 소강 + 노출 부재 이중 타격. <b>라이프(235·전환 2.43)가 6주차 외부반응 견인</b>으로 이동. 연예는 조회는 많으나 전환 0.84로 최저 지속.</div></div>\n\n<div class=\"sec\">미션 · 개근 · 리텐션 · 집중도</div>\n<div class=\"tiles\">\n<div class=\"tile\"><div class=\"k\">미션 통과</div><div class=\"v\">200</div><div class=\"s\">/ 활동 215명</div></div>\n<div class=\"tile\"><div class=\"k\">개근 → 추첨</div><div class=\"v\">144→40</div><div class=\"s\">미수상 우선 배정</div></div>\n<div class=\"tile\"><div class=\"k\">리텐션 W5→W6</div><div class=\"v\">100%</div><div class=\"s\">잔존 214/215</div></div>\n<div class=\"tile\"><div class=\"k\">상위10% 집중</div><div class=\"v\">조회62%</div><div class=\"s\">외부답글 70% 점유</div></div>\n</div>\n<div class=\"note good\">리텐션 <b>100%</b>(이탈 0) — 외부반응은 무너졌어도 크루 이탈은 아직 없음. 단 활동량 −9% 동반 하락은 사기 저하의 초기 신호로 관찰 필요. 상위 10%(21명)가 조회 62%·외부답글 70%를 점유하는 집중 구조는 지속.</div>\n\n<div class=\"sec\">특이점 & 제언</div>\n<div class=\"card note warn\"><b>1) 슬롯이 \"복귀했지만 회복은 없다\".</b> MCP 로그인 조회는 9/3~4 −66% 후 9/13까지 제거 전의 절반 이하에 고착. 주말 복귀분은 형태가 달라져 외부 노출을 회복시키지 못함 → <b>슬롯 형태·위치 재조정, 또는 파트너스/라운지 등 대체 노출면 확보 협의가 시급</b>.<br>\n<b>2) 외부반응 바닥 + 크루 피로 신호.</b> 외부답글 647(비중 3.1%)로 품앗이 고착. 이번엔 원글·크루답글도 −9% 동반 하락 — 노출 부재가 길어지며 크루 사기에 영향. 리그·정산 반응지표가 왜곡될 위험.<br>\n<b>3) 견인 축 이동.</b> 5주차 경제(정치·정책) 견인 → 6주차 라이프로 이동, 경제는 −82%. 특정 카테고리 이슈성에 의존하는 구조 → 안정적 외부 노출 없이는 카테고리 편차가 계속 출렁임.<br>\n<b>4) 3차 격주 리그 마감(9/7~9/13).</b> S9·A24·B46 확정 — 상세는 '리그 결과' 참조. 다음 회차 관건은 <b>외부 노출 복원</b>.</div>\n<div style=\"color:#6E6885;font-size:11.5px;text-align:center;padding:14px\">agorax 크루별상세 CSV(9/14 export, 데이터 9/13까지) · 반응=일요일 스냅샷 · bada(ClickHouse) 로그인 조회 MCP 교차검증 · overrides 3,061 반영 · 대외비</div>\n</div></body></html>\n"}, "sim": {"id": "sim", "title": "크루 이탈 시뮬레이션", "tag": "시뮬레이션", "desc": "크루 종료 시 인기탭 카테고리별 잔존 글·반응 붕괴(-90%)·브릿지 슬롯 제거 효과(-83%) 시뮬레이션과 대응안.", "html": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex,nofollow\">\n<title>크루 이탈 시뮬레이션 · 인기탭 & 반응</title>\n<style>\n:root{--ink:#1F1B2E;--pd:#4A3FA8;--paper:#F7F6FB;--surface:#fff;--line:#E4E0F0;--muted:#6E6885;--warn:#C0392B;--good:#1E9E6A;--blue:#2C6FB5;--amber:#9a6a12}\n*{margin:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,\"Apple SD Gothic Neo\",sans-serif}\nbody{background:var(--paper);color:var(--ink);line-height:1.65;padding:28px 16px}.wrap{max-width:960px;margin:0 auto}\n.hd{background:linear-gradient(135deg,#5B4FBF,#38307F);color:#fff;border-radius:20px;padding:30px;margin-bottom:18px}\n.hd .eb{letter-spacing:4px;font-size:12px;opacity:.8}.hd h1{font-size:23px;font-weight:800;margin-top:6px}.hd .sub{opacity:.9;margin-top:8px;font-size:14px}\n.sec{font-size:19px;font-weight:800;margin:26px 0 10px;color:var(--pd)}.sub2{font-weight:800;font-size:15px;margin:14px 0 6px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}\ntable{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}th{background:#F0EDFA;color:#3A3086;font-weight:700}td.l,th.l{text-align:left}\n.rr{color:var(--warn);font-weight:800}.gg{color:var(--good);font-weight:800}.bb{color:var(--blue);font-weight:800}.am{color:var(--amber);font-weight:800}\n.note{border-radius:12px;padding:13px 16px;font-size:13.5px;line-height:1.8;margin:8px 0}.warn{background:#FBF1F0;border:1px solid #F0D9D6;color:#8A3B32}.good{background:#F0F8F4;border:1px solid #CDEBDD;color:#1a6b47}.info{background:#EEEBFA;border:1px solid var(--line);color:#3A3086}.amber{background:#FEF6E7;border:1px solid #F5E4BE;color:#7d5610}\n.opt{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}.opt h4{font-size:14.5px;margin-bottom:5px}.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:6px}.t-go{background:#E4F5EC;color:#1a6b47}.t-no{background:#FBEEEC;color:#8A3B32}.t-mid{background:#FEF6E7;color:#9a6a12}\n.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:26px;font-weight:800;margin:2px 0}.tile .d{font-size:12px;color:var(--muted)}\n@media(max-width:640px){.tiles{grid-template-columns:1fr}}\n.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin:2px 0 10px}\n.lg{display:inline-flex;align-items:center;gap:5px}.sw{width:12px;height:12px;border-radius:3px;display:inline-block}\n.simrow{display:grid;grid-template-columns:78px 1fr 138px;gap:10px;align-items:center;font-size:13px;margin:11px 0}\n.bars{display:flex;flex-direction:column;gap:3px}\n.barline{position:relative;height:15px;background:#F4F2FB;border-radius:4px;overflow:hidden}\n.fill{position:absolute;left:0;top:0;height:100%;border-radius:4px}\n.fnow{background:#D9D3F2}.fa{background:linear-gradient(90deg,#8b7fe0,#6B5FC7)}.fb{background:linear-gradient(90deg,#e0634f,#C0392B)}\n.nums{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}\n.spark{display:flex;align-items:flex-end;gap:4px;height:78px;margin-top:8px}\n.scol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}\n.scol .b{width:100%}\n.bchart{display:flex;align-items:flex-end;gap:2px;height:104px;margin:12px 0 4px}\n.bchart .bcol{flex:1;border-radius:2px 2px 0 0;min-width:3px}\n.xr{display:flex;justify-content:space-between;font-size:11px;color:#9a94ad;margin-top:2px}\n.plan{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;margin:9px 0}\n.plan .n{width:26px;height:26px;border-radius:50%;background:#5B4FBF;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}\n.plan .n.z{background:#1E9E6A}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<div class=\"hd\"><div class=\"eb\">DAUM COMMUNITY · 심화 IV</div><h1>크루 이탈 시뮬레이션 — 인기탭 & 반응 붕괴</h1>\n<div class=\"sub\">2기 종료 · 3기 예산 없음 · 라운지 11월 중순 — 그 공백을 현재 데이터로 시뮬레이션 · bada·suro 실측 · 2026-09-10 스냅샷</div></div>\n\n<div class=\"info note\"><b>결론 먼저</b> — 크루의 <b>원글 물량은 전체의 0.7%</b>(하루 431글 vs 미러링·외부 6.4만글)에 불과하지만, <b>인기탭 6개 면 전부에서 과반(41~70%)을 저작</b>하고 <b class=\"rr\">플랫폼 답글의 ~90%</b>를 씁니다. 그래서 크루가 빠지면 (1) 크루가 쓴 인기탭 글이 사라져 카테고리별로 즉시 <b>41~70% 축소</b>되고(1차), (2) 살아남은 미러링 글마저 <b>반응 마중물의 90%를 잃어</b> 순위가 밀려 추가 이탈합니다(2차). <b>뉴스는 미러링이 버팁니다(크루 41%)</b>. <b class=\"rr\">스포츠·연예가 가장 위험(52~62%)</b>, 머니는 중간(51%). <b>자동 좋아요·답글 봇은 권하지 않습니다</b>(§5) — \"글 공급\"은 미러링 확장·파트너스 슬롯으로 정직하게 메우고, \"반응\"은 비뉴스 특화 <b>소규모 마중물 크루</b>로만 좁게 유지하는 것이 지표상 최선입니다. 그리고 이번 급감의 <b>직접 원인은 지난주 홈피드 브릿지 슬롯 제거</b>(일반 유저 답글 −83%, §6) — <b>슬롯 복원이 1순위</b>이고, 소규모 크루는 그 위의 보완재입니다.</div>\n\n<!-- ① -->\n<div class=\"sec\">① 크루의 역설 — 물량은 최소, 노출·반응은 지배</div>\n<div class=\"tiles\">\n  <div class=\"tile\"><div class=\"k\">원글 물량 점유 (9/9)</div><div class=\"v bb\">0.7%</div><div class=\"d\">크루 431글 · 미러링/외부 64,023글</div></div>\n  <div class=\"tile\"><div class=\"k\">인기탭 저작 점유 (라이브)</div><div class=\"v rr\">41~70%</div><div class=\"d\">6개 풀 전부 크루 과반 (뉴스만 41%)</div></div>\n  <div class=\"tile\"><div class=\"k\">플랫폼 답글 점유 (9/9)</div><div class=\"v rr\">~90%</div><div class=\"d\">크루 2,567 · 외부 290 / 일</div></div>\n</div>\n<div class=\"note info\">미러링은 \"물량\"만 압도합니다(크루의 <b>~148배</b>). 하지만 유저가 실제로 보는 <b>인기탭</b>과 커뮤니티를 살아있게 만드는 <b>답글</b>은 크루가 만듭니다. 크루 원글은 하루 431건뿐이지만 <b>커뮤니티형(질문·후기·의견) 클린 글</b>이라 반응이 붙어 인기탭에 오르고, 크루 답글 2,600여 건이 그 글들(과 미러링 글)에 반응 velocity를 실어 <b>순위를 밀어 올립니다</b>. 즉 크루는 <b>'글 생산자'가 아니라 '노출·반응 엔진'</b>입니다.</div>\n\n<!-- ② -->\n<div class=\"sec\">② 인기탭 시뮬레이션 — 크루 이탈 3단계 시나리오</div>\n<div class=\"card\">\n  <div class=\"legend\">\n    <span class=\"lg\"><span class=\"sw fnow\"></span>현재 (라이브 측정)</span>\n    <span class=\"lg\"><span class=\"sw fa\"></span>시나리오 A · 크루 글만 빠짐 (측정 하한선)</span>\n    <span class=\"lg\"><span class=\"sw fb\"></span>시나리오 B · 반응 마중물까지 빠짐 (모델 추정)</span>\n  </div>\n\n  <div class=\"simrow\"><div style=\"font-weight:700\">뉴스·경제</div>\n    <div class=\"bars\"><div class=\"barline\"><div class=\"fill fnow\" style=\"width:100%\"></div></div><div class=\"barline\"><div class=\"fill fa\" style=\"width:30.1%\"></div></div><div class=\"barline\"><div class=\"fill fb\" style=\"width:16.8%\"></div></div></div>\n    <div class=\"nums\"><span style=\"color:#9a94ad\">143</span> → <span class=\"am\">43</span> / <span class=\"rr\">24</span></div></div>\n\n  <div class=\"simrow\"><div style=\"font-weight:700\">전체(hot)</div>\n    <div class=\"bars\"><div class=\"barline\"><div class=\"fill fnow\" style=\"width:64.3%\"></div></div><div class=\"barline\"><div class=\"fill fa\" style=\"width:28.0%\"></div></div><div class=\"barline\"><div class=\"fill fb\" style=\"width:12.6%\"></div></div></div>\n    <div class=\"nums\"><span style=\"color:#9a94ad\">92</span> → <span class=\"am\">40</span> / <span class=\"rr\">18</span></div></div>\n\n  <div class=\"simrow\"><div style=\"font-weight:700\">연예</div>\n    <div class=\"bars\"><div class=\"barline\"><div class=\"fill fnow\" style=\"width:25.9%\"></div></div><div class=\"barline\"><div class=\"fill fa\" style=\"width:9.8%\"></div></div><div class=\"barline\"><div class=\"fill fb\" style=\"width:3.5%\"></div></div></div>\n    <div class=\"nums\"><span style=\"color:#9a94ad\">37</span> → <span class=\"am\">14</span> / <span class=\"rr\">5</span></div></div>\n\n  <div class=\"simrow\"><div style=\"font-weight:700\">경제/머니</div>\n    <div class=\"bars\"><div class=\"barline\"><div class=\"fill fnow\" style=\"width:24.5%\"></div></div><div class=\"barline\"><div class=\"fill fa\" style=\"width:11.9%\"></div></div><div class=\"barline\"><div class=\"fill fb\" style=\"width:6.3%\"></div></div></div>\n    <div class=\"nums\"><span style=\"color:#9a94ad\">35</span> → <span class=\"am\">17</span> / <span class=\"rr\">9</span></div></div>\n\n  <div class=\"simrow\"><div style=\"font-weight:700\">뉴스</div>\n    <div class=\"bars\"><div class=\"barline\"><div class=\"fill fnow\" style=\"width:20.3%\"></div></div><div class=\"barline\"><div class=\"fill fa\" style=\"width:11.9%\"></div></div><div class=\"barline\"><div class=\"fill fb\" style=\"width:7.7%\"></div></div></div>\n    <div class=\"nums\"><span style=\"color:#9a94ad\">29</span> → <span class=\"am\">17</span> / <span class=\"rr\">11</span></div></div>\n\n  <div class=\"simrow\"><div style=\"font-weight:700\">스포츠</div>\n    <div class=\"bars\"><div class=\"barline\"><div class=\"fill fnow\" style=\"width:14.7%\"></div></div><div class=\"barline\"><div class=\"fill fa\" style=\"width:7.0%\"></div></div><div class=\"barline\"><div class=\"fill fb\" style=\"width:2.8%\"></div></div></div>\n    <div class=\"nums\"><span style=\"color:#9a94ad\">21</span> → <span class=\"am\">10</span> / <span class=\"rr\">4</span></div></div>\n\n  <div class=\"note amber\" style=\"margin-top:12px\"><b>읽는 법</b> — 회색 = 지금 인기탭에 걸린 글 수. 보라(A)는 <b>크루가 쓴 글만</b> 사라졌을 때 남는 글(=미러링/외부 글, <b>실측 하한</b>). 빨강(B)는 그 미러링 글마저 <b>크루 답글이 끊겨</b> 순위가 밀려 인기탭에서 빠지는 2차 효과까지 반영한 <b>현실 추정</b>. 막대는 모두 뉴스·경제(143) 기준 상대 길이입니다.</div>\n</div>\n\n<!-- ③ -->\n<div class=\"sec\">③ 반응(답글) 붕괴 — 하루 ~2,900 → ~290</div>\n<div class=\"card\">\n<div style=\"font-size:12px;color:#6E6885\">최근 8일 · 플랫폼 전체 depth=1 답글 · 크루(SUPPORTERS 225명) vs 외부</div>\n<div class=\"legend\" style=\"margin-top:6px\"><span class=\"lg\"><span class=\"sw\" style=\"background:#6B5FC7\"></span>크루 답글</span><span class=\"lg\"><span class=\"sw\" style=\"background:#e0634f\"></span>외부 답글</span></div>\n<div class=\"spark\">\n  <div class=\"scol\" title=\"9/02 · 크루 3,034 / 외부 1,073\"><div class=\"b\" style=\"height:72.9%;background:#6B5FC7\"></div><div class=\"b\" style=\"height:25.8%;background:#e0634f;border-radius:0 0 3px 3px\"></div></div>\n  <div class=\"scol\" title=\"9/03 · 크루 3,676 / 외부 483\"><div class=\"b\" style=\"height:88.4%;background:#6B5FC7\"></div><div class=\"b\" style=\"height:11.6%;background:#e0634f;border-radius:0 0 3px 3px\"></div></div>\n  <div class=\"scol\" title=\"9/04 · 크루 2,757 / 외부 209\"><div class=\"b\" style=\"height:66.3%;background:#6B5FC7\"></div><div class=\"b\" style=\"height:5.0%;background:#e0634f;border-radius:0 0 3px 3px\"></div></div>\n  <div class=\"scol\" title=\"9/05 · 크루 2,996 / 외부 221\"><div class=\"b\" style=\"height:72.0%;background:#6B5FC7\"></div><div class=\"b\" style=\"height:5.3%;background:#e0634f;border-radius:0 0 3px 3px\"></div></div>\n  <div class=\"scol\" title=\"9/06 · 크루 3,178 / 외부 224\"><div class=\"b\" style=\"height:76.4%;background:#6B5FC7\"></div><div class=\"b\" style=\"height:5.4%;background:#e0634f;border-radius:0 0 3px 3px\"></div></div>\n  <div class=\"scol\" title=\"9/07 · 크루 2,995 / 외부 253\"><div class=\"b\" style=\"height:72.0%;background:#6B5FC7\"></div><div class=\"b\" style=\"height:6.1%;background:#e0634f;border-radius:0 0 3px 3px\"></div></div>\n  <div class=\"scol\" title=\"9/08 · 크루 2,635 / 외부 290\"><div class=\"b\" style=\"height:63.4%;background:#6B5FC7\"></div><div class=\"b\" style=\"height:7.0%;background:#e0634f;border-radius:0 0 3px 3px\"></div></div>\n  <div class=\"scol\" title=\"9/09 · 크루 2,567 / 외부 290\"><div class=\"b\" style=\"height:61.7%;background:#6B5FC7\"></div><div class=\"b\" style=\"height:7.0%;background:#e0634f;border-radius:0 0 3px 3px\"></div></div>\n</div>\n<div style=\"display:flex;justify-content:space-between;font-size:11px;color:#9a94ad;margin-top:4px\"><span>9/02</span><span>9/05</span><span>9/09</span></div>\n<div class=\"note warn\" style=\"margin-top:12px\"><b>외부 유저는 하루 290건만 답니다.</b> 크루가 빠지면 커뮤니티 답글은 <b class=\"rr\">-90%</b> 급감 — 완만한 하락이 아니라 <b>절벽</b>입니다. 답글은 봇으로 메우면 \"가짜 반응\"이 되고(§5) 실제 유저의 재방문(현재 1주 방문 97%·재방문 2.8%)은 늘지 않습니다. <b>반응 갭이 이번 공백의 진짜 병목</b>입니다.</div>\n</div>\n\n<!-- ④ -->\n<div class=\"sec\">④ 카테고리별 전망 — 뉴스는 버티고, 스포츠·연예가 위험</div>\n<div class=\"card\"><div style=\"font-size:12px;color:#6E6885;margin-bottom:8px\">라이브 인기풀 실측 · 크루 이탈 시 잔존 글 수</div>\n<table>\n<tr><th class=\"l\">인기탭 면</th><th>현재</th><th>크루 저작</th><th>A·글만 빠짐</th><th>B·반응까지(추정)</th><th>판정</th></tr>\n<tr><td class=\"l\"><b>뉴스</b> (news-hot)</td><td>29</td><td>41%</td><td>17</td><td>~11</td><td><span class=\"tag t-go\">버팀</span></td></tr>\n<tr><td class=\"l\"><b>뉴스·경제</b> (news-money)</td><td>143</td><td>70%</td><td>43</td><td>~24</td><td><span class=\"tag t-mid\">주의</span></td></tr>\n<tr><td class=\"l\"><b>경제/머니</b> (money-hot)</td><td>35</td><td>51%</td><td>17</td><td>~9</td><td><span class=\"tag t-mid\">주의</span></td></tr>\n<tr><td class=\"l\"><b>연예</b> (enter-hot)</td><td>37</td><td>62%</td><td>14</td><td>~5</td><td><span class=\"tag t-no\">위험</span></td></tr>\n<tr><td class=\"l\"><b>스포츠</b> (sports-hot)</td><td>21</td><td>52%</td><td>10</td><td>~4</td><td><span class=\"tag t-no\">위험</span></td></tr>\n<tr><td class=\"l\"><b>전체</b> (hot)</td><td>92</td><td>57%</td><td>40</td><td>~18</td><td><span class=\"tag t-mid\">주의</span></td></tr>\n</table>\n<div class=\"note info\" style=\"margin-top:10px\">직관대로 <b>뉴스는 미러링 공급이 두터워(크루 41%) 가장 잘 버팁니다.</b> 반대로 <b>스포츠(21→4)·연예(37→5)</b>는 미러링 백필이 얇고 크루 커뮤니티 원글 의존이 커서, 반응까지 빠지면 <b>인기탭이 사실상 비어 보이는</b> 수준까지 갈 수 있습니다. 머니(35→9)는 그 중간입니다.</div></div>\n\n<!-- ⑤ -->\n<div class=\"sec\">⑤ 대응 전략 — 봇을 만들 것인가</div>\n<div class=\"card\">\n<div class=\"note warn\"><b>자동 좋아요/답글 봇 · 유저인 척 글 쓰는 봇 → 권장하지 않음.</b>\n① <b>기만·신뢰 리스크</b>: 이 커뮤니티 최대 약점이 이미 \"폐쇄 루프\"(외부 답글 0.04%)인데, 가짜 반응을 얹으면 위장을 한 겹 더 두껍게 할 뿐 실제 유저 재방문은 안 늘어남. 노출되면 브랜드 리스크. ② <b>측정 파괴</b>: 크루를 빼는 유일한 이점은 \"정직한 축소 신호\"를 얻는 것인데, 봇 반응을 섞으면 무엇이 진짜 먹히는지 영영 못 봄. ③ <b>병목 오인</b>: 갭의 본질은 '글'이 아니라 '반응'인데 봇 원글은 반응을 못 만듦.</div>\n<div class=\"sub2\">대신 — \"글 공급\"은 정직한 자동화로, \"반응\"은 좁은 인력으로:</div>\n<div class=\"opt\"><h4>A. 미러링 카테고리 확장 <span class=\"tag t-go\">봇 OK · 즉시</span></h4>미러링은 이미 자동 수집입니다. 지금 <b>뉴스 69% 편중</b>이니 <b>스포츠·연예·머니 소스를 파이프라인에 추가</b>하면, 유저를 가장하지 않고(출처 명시) 스포츠/연예/머니 <b>원글 공백을 메웁니다</b>. 가장 빠르고 안전한 카드.</div>\n<div class=\"opt\"><h4>B. 파트너스/공식(OFFICIAL) 라벨 슬롯 <span class=\"tag t-go\">인프라 있음 · 권장</span></h4>편집형·큐레이션 글을 <b>'공식/파트너스'로 라벨링</b>해 발행(유저인 척 아님). 심화 III의 ④-A 파트너스 지정 슬롯과 연결 — 인기 경쟁에서 떼어 브릿지를 차별화. <b>2기 종료 전 2~3주 A/B</b>로 \"크루 없이 비뉴스 순환이 도는가\" 검증.</div>\n<div class=\"opt\"><h4>C. 비뉴스 특화 <b>소규모 3기</b> (반응 시드) <span class=\"tag t-mid\">최소 예산</span></h4>반응 90%를 전량 잃느니, <b>스포츠·연예·머니 리액션 중심 20~30명</b>만 최소 예산으로 유지. 봇이 못 메우는 '마중물'을 비용대비 가장 크게 방어. 콘텐츠 크루는 축소, 리액션 미니 크루만 남기는 형태.</div>\n<div class=\"opt\"><h4>D. 라운지(11월 중순) 브릿지 <span class=\"tag t-mid\">병행 준비</span></h4>라운지 전까지 A+B로 스포츠/연예/머니 최신순 면을 임시 운영. 라운지 오픈 시 콘텐츠 매핑을 미리 준비.</div>\n<div class=\"note good\"><b>권고 순서</b> — ⓪ <b>브릿지 슬롯 복원이 1순위</b>(무비용·검증된 최대 효과, §6) → ①미러링을 스포츠·연예·머니로 확장(A) → ②잔류·마케팅 잔여 예산으로 <b>소규모 마중물 크루</b> 운영(§7)으로 라운지 전까지 브릿지 → ③이 인원 <b>파트너스 승격 검토 + 파트너스 정책 재설계</b>. 봇은 '글'에만, '반응'에는 쓰지 않습니다.</div>\n</div>\n\n<!-- ⑥ -->\n<div class=\"sec\">⑥ 근거 — 브릿지 슬롯 제거가 원인 (일반 유저 답글 −83%)</div>\n<div class=\"card\">\n<div style=\"font-size:12px;color:#6E6885\">최근 30일 · 일반(비크루) 유저 답글/일 · bada.thread depth=1 · <span style=\"color:#6B5FC7;font-weight:700\">■</span> 슬롯 有 &nbsp;<span style=\"color:#e0a020;font-weight:700\">■</span> 제거일(9/3) &nbsp;<span style=\"color:#C0392B;font-weight:700\">■</span> 슬롯 無</div>\n<div class=\"bchart\">\n<div class=\"bcol\" title=\"8/11 · 1,738\" style=\"height:52.0%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/12 · 2,080\" style=\"height:62.2%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/13 · 2,320\" style=\"height:69.4%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/14 · 3,345\" style=\"height:100%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/15 · 1,976\" style=\"height:59.1%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/16 · 1,420\" style=\"height:42.5%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/17 · 1,884\" style=\"height:56.3%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/18 · 1,718\" style=\"height:51.4%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/19 · 1,663\" style=\"height:49.7%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/20 · 1,613\" style=\"height:48.2%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/21 · 1,682\" style=\"height:50.3%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/22 · 1,364\" style=\"height:40.8%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/23 · 1,701\" style=\"height:50.9%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/24 · 1,876\" style=\"height:56.1%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/25 · 1,247\" style=\"height:37.3%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/26 · 1,914\" style=\"height:57.2%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/27 · 1,638\" style=\"height:49.0%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/28 · 1,271\" style=\"height:38.0%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/29 · 1,163\" style=\"height:34.8%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/30 · 1,201\" style=\"height:35.9%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"8/31 · 1,514\" style=\"height:45.3%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"9/01 · 1,097\" style=\"height:32.8%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"9/02 · 1,073\" style=\"height:32.1%;background:#6B5FC7\"></div>\n<div class=\"bcol\" title=\"9/03 · 483 (슬롯 제거)\" style=\"height:14.4%;background:#e0a020\"></div>\n<div class=\"bcol\" title=\"9/04 · 209\" style=\"height:6.2%;background:#C0392B\"></div>\n<div class=\"bcol\" title=\"9/05 · 221\" style=\"height:6.6%;background:#C0392B\"></div>\n<div class=\"bcol\" title=\"9/06 · 224\" style=\"height:6.7%;background:#C0392B\"></div>\n<div class=\"bcol\" title=\"9/07 · 253\" style=\"height:7.6%;background:#C0392B\"></div>\n<div class=\"bcol\" title=\"9/08 · 290\" style=\"height:8.7%;background:#C0392B\"></div>\n<div class=\"bcol\" title=\"9/09 · 290\" style=\"height:8.7%;background:#C0392B\"></div>\n</div>\n<div class=\"xr\"><span>8/11</span><span>8/20</span><span>9/3 ▼ 슬롯 제거</span><span>9/9</span></div>\n<div class=\"note warn\" style=\"margin-top:12px\"><b>홈피드 브릿지 슬롯(인기글에서 유입→조회→답글)이 2기 유입의 핵심 경로였습니다.</b> 슬롯이 있던 8/11~9/2엔 일반 유저 답글이 <b>하루 평균 ~1,450건</b>(최대 3,345). <b>9/3 슬롯 제거</b> 직후 <b class=\"rr\">하루 ~250건으로 −83% 붕괴</b>. 같은 기간 <b>크루 활동은 그대로</b>(크루 답글 ~2,600/일 유지)였으니 원인은 크루가 아니라 <b>제거된 유입 슬롯</b>입니다. 즉 2기의 목표(일반 유저 답글 유도)는 <b>슬롯이 있을 때 실제로 작동</b>하고 있었고, <b>복원만으로 하루 ~1,200건의 외부 답글을 되찾을 수 있습니다</b>(무비용).</div>\n</div>\n\n<!-- ⑦ -->\n<div class=\"sec\">⑦ 조직 보고 — 라운지 전까지 전환 계획</div>\n<div class=\"card\">\n<div class=\"note info\" style=\"margin-bottom:12px\"><b>3줄 요약</b> — (1) 지난주 <b>브릿지 슬롯 제거로 일반 유저 답글 −83%</b>. 2기는 슬롯이 있을 때 목표를 달성 중이었음. (2) <b>슬롯 복원(무비용)</b> + <b>잔류·마케팅 잔여 예산의 소규모 마중물 크루</b>로 라운지(11월 중순) 전까지 버틴다. (3) 이 인원을 <b>파트너스로 승격</b>하고, 사실상 실패한 <b>현 파트너스 정책은 재설계</b>(레이첼 협의).</div>\n<div class=\"plan\"><div class=\"n z\">0</div><div><b>브릿지 슬롯 복원 — 최우선·무비용</b><br><span style=\"color:#555\">검증된 +~1,200 답글/일. 제품/배치 변경만으로 즉시 회복. 크루·예산 논의 이전에 선행.</span></div></div>\n<div class=\"plan\"><div class=\"n\">1</div><div><b>소규모 마중물 크루 — 잔류(2기) + 마케팅 잔여 예산</b><br><span style=\"color:#555\">20~30명, 낮은 고정비+인센티브. <b>비크루 글에만 단 답글로 카운트</b>(품앗이 0점) + 카테고리 배정 + 유효지표(외부 답글·좋아요 되받음) 리더보드. 라운지 글 축적까지 브릿지. 지금 크루 답글의 94.5%가 품앗이라, 소규모라도 <b>조준하면 공개 반응은 유지</b>됨(§5).</span></div></div>\n<div class=\"plan\"><div class=\"n\">2</div><div><b>이 인원 파트너스 승격 검토</b><br><span style=\"color:#555\">마중물 크루 중 성과·지속성 상위를 파트너스로. 리워드 구조를 승격 경로와 연결해 소규모에서도 동기 유지.</span></div></div>\n<div class=\"plan\"><div class=\"n\">3</div><div><b>파트너스 정책 재설계 (레이첼 협의)</b><br><span style=\"color:#555\">현 파트너스/인플루언서는 <b>사실상 개점휴업</b> — 29명 등록에 <b>하루 활동 ~10명·글 ~15개·답글 ~2개</b>(반응 기여 ≈ 0). 옵션: (a) 유지 + 인플루언서 마크 부여로 정체성 강화, (b) 마중물 크루와 <b>통폐합</b>해 단일 트랙화. 어느 쪽이든 \"반응 기여\" 기준으로 재정의 필요.</span></div></div>\n<div class=\"note good\"><b>예산 논리</b> — 슬롯 복원(0원)으로 대부분 회복 → 남는 갭만 소규모 크루(잔류+잔여 예산)로 메움 → 검증되면 파트너스 트랙으로 정규화. 신규 3기 대규모 모집 없이 라운지까지 연결.</div>\n</div>\n\n<div style=\"color:#6E6885;font-size:11.5px;text-align:center;padding:14px\">\n인기풀: suro.content_pool_item(라이브, expired_at&gt;now) × daily_user_detail_snapshot 저작 매칭 · 반응/물량: bada.thread_distributed(depth 0/1) 크루 225명 대조 · 활동추세: suro.daily_user_activity_snapshot · <b>시나리오 B는 반응-velocity 기반 모델 추정</b>(카테고리별 미러링 독립성 계수 news .65 / money .50 / news-money .55 / hot .45 / enter .35 / sports .35) · 슬롯효과(⑥): bada.thread depth=1 비크루 답글 30일(슬롯 有 8/11~9/2 ~1,450/일 → 無 9/4~9/9 ~248/일) · 품앗이율: detail_snapshot 부모글 크루 매칭(94.5%) · 파트너스(⑦): activity_snapshot INFLUENCER 롤 14일 · 2026-09-10 · 대외비\n</div>\n</div>\n</body>\n</html>\n"}, "roadmap": {"id": "roadmap", "title": "인플루언서 티어 전환 로드맵", "tag": "전략 로드맵", "desc": "핵심 크루→인플루언서 티어→(장기)수익 쉐어 전환의 정책·업무·일정·스펙 5단계 로드맵. 평가는 홈피드 복원 후.", "html": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex,nofollow\">\n<title>인플루언서 티어 전환 로드맵</title>\n<style>\n:root{--ink:#1F1B2E;--pd:#4A3FA8;--paper:#F7F6FB;--surface:#fff;--line:#E4E0F0;--muted:#6E6885;--warn:#C0392B;--good:#1E9E6A;--blue:#2C6FB5;--amber:#9a6a12}\n*{margin:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,\"Apple SD Gothic Neo\",sans-serif}\nbody{background:var(--paper);color:var(--ink);line-height:1.65;padding:28px 16px}.wrap{max-width:960px;margin:0 auto}\n.hd{background:linear-gradient(135deg,#5B4FBF,#38307F);color:#fff;border-radius:20px;padding:30px;margin-bottom:18px}\n.hd .eb{letter-spacing:4px;font-size:12px;opacity:.8}.hd h1{font-size:23px;font-weight:800;margin-top:6px}.hd .sub{opacity:.9;margin-top:8px;font-size:14px}\n.sec{font-size:19px;font-weight:800;margin:26px 0 10px;color:var(--pd)}.sub2{font-weight:800;font-size:14px;margin:12px 0 5px;color:var(--pd)}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}\n.rr{color:var(--warn);font-weight:800}.gg{color:var(--good);font-weight:800}.bb{color:var(--blue);font-weight:800}.am{color:var(--amber);font-weight:800}\n.note{border-radius:12px;padding:13px 16px;font-size:13.5px;line-height:1.8;margin:8px 0}.warn{background:#FBF1F0;border:1px solid #F0D9D6;color:#8A3B32}.good{background:#F0F8F4;border:1px solid #CDEBDD;color:#1a6b47}.info{background:#EEEBFA;border:1px solid var(--line);color:#3A3086}.amber{background:#FEF6E7;border:1px solid #F5E4BE;color:#7d5610}\n.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:4px}.t-go{background:#E4F5EC;color:#1a6b47}.t-no{background:#FBEEEC;color:#8A3B32}.t-mid{background:#FEF6E7;color:#9a6a12}.t-bl{background:#E7F0FA;color:#245a8c}\n/* 타임라인 */\n.tl{display:flex;gap:6px;margin:10px 0 4px;overflow-x:auto}\n.tl .ph{flex:1;min-width:120px;border-radius:12px;padding:11px 12px;color:#fff}\n.tl .ph .p{font-size:11px;opacity:.85;letter-spacing:1px}.tl .ph .t{font-size:13.5px;font-weight:800;margin:2px 0}.tl .ph .d{font-size:11px;opacity:.9}\n.p0{background:#1E9E6A}.p1{background:#5B4FBF}.p2{background:#7A4FBF}.p3{background:#B8892A}.p4{background:#C0392B}\n/* phase 상세 */\n.pc{border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:12px;overflow:hidden}\n.pc .ph-hd{padding:12px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}\n.pc .ph-hd .t{font-size:15px;font-weight:800}.pc .ph-hd .d{font-size:12px;opacity:.92}\n.pc .body{padding:14px 16px}\n.row{display:grid;grid-template-columns:74px 1fr;gap:10px;font-size:13px;margin:7px 0;align-items:start}\n.row .k{font-weight:800;color:var(--pd);font-size:12.5px;padding-top:1px}\n.chk{list-style:none;padding:0;margin:0}.chk li{font-size:13px;padding:3px 0 3px 20px;position:relative;line-height:1.6}\n.chk li::before{content:\"▸\";position:absolute;left:4px;color:#5B4FBF;font-weight:800}\ntable{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}th{background:#F0EDFA;color:#3A3086;font-weight:700;font-size:12px}\n.deco{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<div class=\"hd\"><div class=\"eb\">DAUM COMMUNITY · 전략 로드맵</div><h1>인플루언서 티어 전환 로드맵 — 정책·업무·일정·스펙</h1>\n<div class=\"sub\">핵심 크루 → 인플루언서 티어 → (장기) 수익 쉐어 · 일반 유저 승격 사다리 · 파트너스 재편 · 2026-09-11 · 「크루 이탈 시뮬레이션」 후속</div></div>\n\n<div class=\"info note\"><b>이 로드맵의 목적</b> — 단순 크루 유지가 아니라 네 가지: ① 애착 있게 활동한 <b>핵심 크루에 당장의 당근 + 미래 우대</b> 제안, ② <b>파트너스 효율·방향 재검토</b>, ③ 장기적으로 <b>일반 유저에게 \"글 열심히 쓰고 팬 모으면 승격\"</b>이라는 동기 부여, ④ 궁극적으로 고정비 → <b>광고 수익 쉐어</b>(내년 하반기 목표). <b>지금 당장은 정산을 건드리지 않고 \"개념 합의 + 종료 전 설득\"</b>까지만 갑니다. <b class=\"rr\">크루 평가·승격은 홈피드(브릿지 슬롯) 복원으로 품앗이가 정상화된 뒤에</b> 시작합니다(현재 데이터는 오염).</div>\n\n<!-- 타임라인 -->\n<div class=\"sec\">한눈에 — 5단계 타임라인</div>\n<div class=\"card\">\n<div class=\"tl\">\n  <div class=\"ph p0\"><div class=\"p\">PHASE 0</div><div class=\"t\">복구 & 설득</div><div class=\"d\">지금~2기 종료<br>(~10월 초)</div></div>\n  <div class=\"ph p1\"><div class=\"p\">PHASE 1</div><div class=\"t\">브릿지 운영</div><div class=\"d\">2기 종료~라운지<br>(10월~11월 중순)</div></div>\n  <div class=\"ph p2\"><div class=\"p\">PHASE 2</div><div class=\"t\">사다리 공개·파트너스 재편</div><div class=\"d\">라운지 이후<br>(~2027 상반기)</div></div>\n  <div class=\"ph p3\"><div class=\"p\">PHASE 3</div><div class=\"t\">쉐어 스펙 본작업</div><div class=\"d\">2027 상반기</div></div>\n  <div class=\"ph p4\"><div class=\"p\">PHASE 4</div><div class=\"t\">수익 쉐어 정식</div><div class=\"d\">2027 하반기</div></div>\n</div>\n<div class=\"note amber\" style=\"margin-top:10px\"><b>스펙 무게가 뒤로 갈수록 커집니다.</b> Phase 0~1은 가벼움(마크·리테이너, 정산 변경 없음) → Phase 2 중간(지표·티어·계약) → <b>Phase 3~4가 무거움</b>(수익 귀속·세무·정산 시스템). 그래서 <b>지금은 앞 두 단계만 실행하고, 무거운 스펙은 도달(트래픽·라운지)이 확인된 뒤로</b> 미룹니다.</div>\n</div>\n\n<!-- 선결 조건 -->\n<div class=\"sec\">모든 단계의 선결 조건 (dependency)</div>\n<div class=\"card note warn\">\n<b>① 브릿지 슬롯 복원 = 최우선·무비용.</b> 이게 안 되면 (a) 외부 반응이 −83%인 채라 <b>수익 쉐어의 도달 자체가 없고</b>, (b) 품앗이가 부풀어 <b>승격 평가를 신뢰할 수 없습니다</b>. 로드맵의 첫 삽.<br>\n<b>② 라운지(11월 중순) = 사다리 공개·콘텐츠 공급의 전제.</b> 라운지 글이 모여야 비뉴스 순환이 돌고, 그 위에서 사다리가 의미를 가집니다.<br>\n<b>③ 평가·승격은 홈피드 복원 후로.</b> (사용자 방침 반영) 지금 데이터로 핵심 크루를 뽑으면 품앗이 볼륨을 승격시키는 오류가 납니다.\n</div>\n\n<!-- Phase 상세 -->\n<div class=\"sec\">Phase별 상세 — 정책 · 업무 · 스펙 · 결정</div>\n\n<div class=\"pc\">\n  <div class=\"ph-hd p0\"><div class=\"t\">PHASE 0 · 복구 & 설득</div><div class=\"d\">지금 ~ 2기 종료(~10월 초)</div></div>\n  <div class=\"body\">\n    <div class=\"row\"><div class=\"k\">목표</div><div>유입 복구로 지표 신뢰 회복 + 핵심 크루에 <b>개념 제안(종료 전)</b>. 정산 변경 없음.</div></div>\n    <div class=\"row\"><div class=\"k\">정책</div><div>브릿지 슬롯 복원(최우선). \"인플루언서 티어 + 승격 루트\" <b>개념 합의</b>까지만 — 금액·시점 확약 금지.</div></div>\n    <div class=\"row\"><div class=\"k\">업무</div><div><ul class=\"chk\"><li>슬롯 복원 요청·배치 (제품팀)</li><li>핵심 크루 대상 <b>세그먼트별 제안 커뮤니케이션</b>(아래 §설득 패키지)</li><li>파트너스 현황 재검토 착수 (레이첼) — 효율 데이터 기반</li></ul></div></div>\n    <div class=\"row\"><div class=\"k\">스펙</div><div><span class=\"tag t-go\">가벼움</span> 제안 메시지 초안 · 인플루언서 마크 개념안 · 파트너스 진단 1장</div></div>\n    <div class=\"row\"><div class=\"k\">결정</div><div>슬롯 복원 시점 · 리테이너 예산/인원(20~30?) · 파트너스 방향(유지+마크 vs 통폐합)</div></div>\n  </div>\n</div>\n\n<div class=\"pc\">\n  <div class=\"ph-hd p1\"><div class=\"t\">PHASE 1 · 브릿지 운영</div><div class=\"d\">2기 종료 ~ 라운지(10월~11월 중순)</div></div>\n  <div class=\"body\">\n    <div class=\"row\"><div class=\"k\">목표</div><div>저비용으로 <b>반응 마중물 유지</b> + 인플루언서 마크로 <b>상태(당근)</b> 부여. 평가·승격은 <b>보류</b>.</div></div>\n    <div class=\"row\"><div class=\"k\">정책</div><div>소규모 마중물 크루 20~30명(잔류+마케팅 예산). <b>비크루 글 한정 답글 카운트</b> + 카테고리 배정 + 유효지표 리더보드. 미러링 스포츠·연예·머니 확장 병행.</div></div>\n    <div class=\"row\"><div class=\"k\">업무</div><div><ul class=\"chk\"><li>리테이너 계약·정산(소규모라 단순)</li><li>인플루언서 마크 표시(프로필·피드 뱃지)</li><li>리더보드 운영 · 미러링 소스 확장</li></ul></div></div>\n    <div class=\"row\"><div class=\"k\">스펙</div><div><span class=\"tag t-mid\">중하</span> 마크 표시 UI · 리테이너 정산(단순) · 유효지표(외부 답글·좋아요 되받음) 산출</div></div>\n    <div class=\"row\"><div class=\"k\">결정</div><div>마크 부여 대상(1·2기 핵심 몇 명·기준은 잠정) · 인센티브 구조</div></div>\n  </div>\n</div>\n\n<div class=\"pc\">\n  <div class=\"ph-hd p2\"><div class=\"t\">PHASE 2 · 사다리 공개 & 파트너스 재편</div><div class=\"d\">라운지 이후 ~ 2027 상반기</div></div>\n  <div class=\"body\">\n    <div class=\"row\"><div class=\"k\">목표</div><div>승격 사다리 <b>공식화·공개</b> + 파트너스 고정비 <b>축소/폐지</b>. 첫 공식 승격.</div></div>\n    <div class=\"row\"><div class=\"k\">정책</div><div>일반 → (에디터) → 인플루언서 <b>승격 기준 공개(받은 외부 반응 기준)</b> + 실제 승격 사례 노출. 파트너스는 인플루언서 티어로 <b>통폐합 또는 마크 흡수</b>.</div></div>\n    <div class=\"row\"><div class=\"k\">업무</div><div><ul class=\"chk\"><li><b>크루 평가 재개</b>(홈피드 복원되어 정상화된 데이터로) → 첫 승격</li><li>파트너스 기존 계약 정리·매핑</li><li>사다리 안내 페이지·공지</li></ul></div></div>\n    <div class=\"row\"><div class=\"k\">스펙</div><div><span class=\"tag t-mid\">중</span> 승격 지표 파이프라인(외부 반응 산출·주기) · 티어 정의(권한·표식·혜택) · 파트너스 계약 처리</div></div>\n    <div class=\"row\"><div class=\"k\">결정</div><div>티어 수·이름(인플루언서 단일 vs 에디터+인플루언서) · 승격 컷라인·주기·강등 규칙</div></div>\n  </div>\n</div>\n\n<div class=\"pc\">\n  <div class=\"ph-hd p3\"><div class=\"t\">PHASE 3 · 수익 쉐어 스펙 본작업</div><div class=\"d\">2027 상반기</div></div>\n  <div class=\"body\">\n    <div class=\"row\"><div class=\"k\">목표</div><div>무거운 <b>정산 스펙 설계 + 소수 파일럿</b>.</div></div>\n    <div class=\"row\"><div class=\"k\">정책</div><div>소수 인플루언서 대상 쉐어 시범 → 검증 후 확대.</div></div>\n    <div class=\"row\"><div class=\"k\">업무</div><div><ul class=\"chk\"><li>광고수익–콘텐츠 <b>귀속 로직</b></li><li>세무(원천징수)·계약서·정산 자동화</li><li>어뷰징 방지(품앗이/봇 반응 배제) 설계</li></ul></div></div>\n    <div class=\"row\"><div class=\"k\">스펙</div><div><span class=\"tag t-no\">무거움</span> 수익 귀속 · 세무·계약 · 정산 시스템 · 대시보드 · 부정방지</div></div>\n    <div class=\"row\"><div class=\"k\">결정</div><div>쉐어 비율·산식 · 최소 지급 기준 · 대상 티어 범위</div></div>\n  </div>\n</div>\n\n<div class=\"pc\">\n  <div class=\"ph-hd p4\"><div class=\"t\">PHASE 4 · 수익 쉐어 정식</div><div class=\"d\">2027 하반기</div></div>\n  <div class=\"body\">\n    <div class=\"row\"><div class=\"k\">목표</div><div>고정비 모델 종료 → <b>rev-share 정식</b>. 사다리 최상단 보상 = 실제 수익 → 일반 유저 동기 완성.</div></div>\n    <div class=\"row\"><div class=\"k\">정책</div><div>고정비 종료, 성과·수익 연동. 승격 사다리 전 구간 가동.</div></div>\n    <div class=\"row\"><div class=\"k\">스펙</div><div><span class=\"tag t-mid\">운영</span> 안정화·성과 모니터링·이상 감지</div></div>\n  </div>\n</div>\n\n<!-- 트랙 매트릭스 -->\n<div class=\"sec\">4개 트랙 — 무엇이 언제 움직이나</div>\n<div class=\"card\">\n<table>\n<tr><th>트랙</th><th>Phase 0</th><th>Phase 1</th><th>Phase 2</th><th>Phase 3~4</th></tr>\n<tr><td><b>크루·인플루언서</b></td><td>개념 제안·설득</td><td>마크 부여·리테이너</td><td>평가 재개·첫 승격</td><td>쉐어 대상</td></tr>\n<tr><td><b>파트너스 재편</b></td><td>현황 진단(레이첼)</td><td>방향 확정</td><td>통폐합/마크 흡수</td><td>고정비 종료</td></tr>\n<tr><td><b>일반 유저 사다리</b></td><td>—</td><td>마크 '목표'로 노출</td><td>기준 공개·사례</td><td>승격=수익 실현</td></tr>\n<tr><td><b>수익 쉐어/정산</b></td><td>—</td><td>—</td><td>개념·귀속 검토</td><td>스펙·파일럿·정식</td></tr>\n</table>\n</div>\n\n<!-- 설득 패키지 -->\n<div class=\"sec\">종료 전 크루 설득 패키지 (Phase 0)</div>\n<div class=\"card\">\n<div class=\"note info\"><b>세그먼트를 나눠 말합니다.</b> 전원에게 같은 말을 하면 \"승격으로 포장한 급여 삭감\"으로 읽힙니다.</div>\n<div class=\"sub2\"><span class=\"deco\" style=\"background:#1E9E6A\"></span>핵심 크루 (상위·애착 높음)</div>\n<ul class=\"chk\">\n<li><b>당장의 당근</b> — 인플루언서 마크(상태) + 소규모 마중물 크루 리테이너(소액 보상) + 향후 승격 우선권</li>\n<li><b>미래 우대</b> — 수익 쉐어 도입 시 <b>우선 참여</b>(단, 시점·금액은 \"목표\"로만, 확약 금지)</li>\n</ul>\n<div class=\"sub2\"><span class=\"deco\" style=\"background:#5B4FBF\"></span>일반 크루</div>\n<ul class=\"chk\">\n<li>\"2기는 <b>예정된 기간제</b>였다\"로 명확히 — 축소는 계획된 것</li>\n<li>단 <b>승격 루트는 열려 있다</b>(외부 반응 기준). 다시 지원·재진입 경로 안내</li>\n</ul>\n<div class=\"note warn\" style=\"margin-top:8px\"><b>절대 하지 말 것</b> — 쉐어 금액·시점 확약(내년 하반기는 '목표'일 뿐), 전원 동일 메시지, 지금 평가 결과로 우열 통보(데이터 오염).</div>\n</div>\n\n<!-- 스펙 난이도 -->\n<div class=\"sec\">스펙 정리 — 무엇을·언제·난이도</div>\n<div class=\"card\">\n<table>\n<tr><th>스펙 항목</th><th>시점</th><th>난이도</th></tr>\n<tr><td>인플루언서 마크(표시·부여/회수)</td><td>Phase 1</td><td><span class=\"tag t-go\">가벼움</span></td></tr>\n<tr><td>리테이너·인센티브 정산(소규모)</td><td>Phase 1</td><td><span class=\"tag t-go\">가벼움</span></td></tr>\n<tr><td>승격 기준 지표 파이프라인(외부 반응 산출)</td><td>Phase 2</td><td><span class=\"tag t-mid\">중</span></td></tr>\n<tr><td>티어 정의(권한·표식·혜택·강등)</td><td>Phase 2</td><td><span class=\"tag t-mid\">중</span></td></tr>\n<tr><td>파트너스 계약 처리·통폐합 매핑</td><td>Phase 2</td><td><span class=\"tag t-mid\">중</span></td></tr>\n<tr><td>수익 귀속·세무·계약·정산 시스템</td><td>Phase 3</td><td><span class=\"tag t-no\">무거움</span></td></tr>\n<tr><td>어뷰징 방지(품앗이·봇 반응 배제)</td><td>Phase 3</td><td><span class=\"tag t-no\">무거움</span></td></tr>\n</table>\n</div>\n\n<!-- 지금 결정할 것 -->\n<div class=\"sec\">지금(Phase 0) 결정해야 할 것</div>\n<div class=\"card note good\">\n<b>1. 브릿지 슬롯 복원 시점</b> — 나머지 전부의 선결. 가장 먼저.<br>\n<b>2. 리테이너 예산·인원</b> — 잔류(2기)+마케팅 잔여로 20~30명 규모/단가.<br>\n<b>3. 파트너스 방향</b> — 유지+인플루언서 마크 vs 통폐합 (레이첼 협의 결과).<br>\n<b>4. 티어 구조</b> — 인플루언서 단일 티어인가, 에디터+인플루언서 2단인가.<br>\n<b>5. 평가 재개 시점</b> — 홈피드 복원 후 며칠(품앗이 정상화 확인)부터.<br>\n<b>6. 마크 부여 대상</b> — 1·2기 핵심 몇 명에게, 잠정 기준으로 먼저 줄지.\n</div>\n\n<div style=\"color:#6E6885;font-size:11.5px;text-align:center;padding:14px\">\n전략 로드맵 · 정산 미변경(Phase 0~1) · 평가·승격은 홈피드 복원 후 데이터 정상화 이후 · 근거 지표는 「크루 이탈 시뮬레이션」 리포트 참조 · 2026-09-11 · 대외비\n</div>\n</div>\n</body>\n</html>\n"}, "select": {"id": "select", "title": "소규모 마중물 크루 선발안", "tag": "선발안", "desc": "20~30명 소규모 크루의 카테고리 분배와 유력 후보(유효답글·받은좋아요·꾸준함 기준). 잠정, 홈피드 복원 후 재검증.", "html": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex,nofollow\">\n<title>소규모 마중물 크루 선발안</title>\n<style>\n:root{--ink:#1F1B2E;--pd:#4A3FA8;--paper:#F7F6FB;--surface:#fff;--line:#E4E0F0;--muted:#6E6885;--warn:#C0392B;--good:#1E9E6A;--blue:#2C6FB5;--amber:#9a6a12}\n*{margin:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,\"Apple SD Gothic Neo\",sans-serif}\nbody{background:var(--paper);color:var(--ink);line-height:1.6;padding:28px 16px}.wrap{max-width:960px;margin:0 auto}\n.hd{background:linear-gradient(135deg,#5B4FBF,#38307F);color:#fff;border-radius:20px;padding:30px;margin-bottom:18px}\n.hd .eb{letter-spacing:4px;font-size:12px;opacity:.8}.hd h1{font-size:23px;font-weight:800;margin-top:6px}.hd .sub{opacity:.9;margin-top:8px;font-size:14px}\n.sec{font-size:19px;font-weight:800;margin:26px 0 10px;color:var(--pd)}.sub2{font-weight:800;font-size:14.5px;margin:16px 0 6px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}\ntable{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--line)}th{background:#F0EDFA;color:#3A3086;font-weight:700;font-size:12px}td.l,th.l{text-align:left}\n.rr{color:var(--warn);font-weight:800}.gg{color:var(--good);font-weight:800}.bb{color:var(--blue);font-weight:800}\n.note{border-radius:12px;padding:13px 16px;font-size:13.5px;line-height:1.75;margin:8px 0}.warn{background:#FBF1F0;border:1px solid #F0D9D6;color:#8A3B32}.good{background:#F0F8F4;border:1px solid #CDEBDD;color:#1a6b47}.info{background:#EEEBFA;border:1px solid var(--line);color:#3A3086}.amber{background:#FEF6E7;border:1px solid #F5E4BE;color:#7d5610}\n.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px}.t-s{background:#E7F0FA;color:#245a8c}.t-b{background:#EEEBFA;color:#4A3FA8}.t-a{background:#FEF6E7;color:#9a6a12}\n.rank{color:#9a94ad;font-weight:700}\n.catbar{display:inline-block;font-size:12px;font-weight:800;padding:3px 11px;border-radius:8px;color:#fff}\n.c-sp{background:#2C6FB5}.c-en{background:#C0398f}.c-ec{background:#1E9E6A}.c-lf{background:#9a6a12}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<div class=\"hd\"><div class=\"eb\">DAUM COMMUNITY · 선발안</div><h1>소규모 마중물 크루 선발안 — 카테고리 분배 & 후보</h1>\n<div class=\"sub\">2기 잔류 기반 20~30명 · 지표 기간 8/3~9/13 · 유효답글·받은좋아요·꾸준함 기준 · 2026-09-14 · 「전환 로드맵」 Phase 1</div></div>\n\n<div class=\"info note\"><b>선발 원칙 — \"실력순으로 뽑고, 수요순으로 배치\".</b> 답글은 토픽 무관이라, 후보는 <b>실력(유효 답글)</b>으로 뽑고 배치는 <b>인기탭 위험도</b>에 맞춥니다. 후보 지표는 <b>품앗이 오염을 피하려</b>고 ① <b class=\"gg\">유효 답글</b>(크루끼리가 아니라 <b>비크루(미러링·외부) 글에 단 답글</b> — 실제 공개 피드에 보이는 반응), ② <b>받은 좋아요</b>(콘텐츠 반향), ③ <b>활동일수</b>(꾸준함)로 산정했습니다. <b class=\"rr\">이 명단은 잠정입니다</b> — 홈피드(브릿지 슬롯) 복원으로 품앗이가 정상화된 뒤 최종 재검증 권장(로드맵 Phase 2).</div>\n\n<!-- 분배안 -->\n<div class=\"sec\">① 카테고리 분배안 — 20 / 25 / 30명</div>\n<div class=\"card\">\n<table>\n<tr><th class=\"l\">카테고리</th><th>인기탭 위험도</th><th>시더 인재풀</th><th>20명</th><th>25명 <span class=\"gg\">(권장)</span></th><th>30명</th></tr>\n<tr><td class=\"l\"><span class=\"catbar c-sp\">스포츠</span></td><td class=\"rr\">높음 (21→4)</td><td>중</td><td>6</td><td><b>7</b></td><td>8</td></tr>\n<tr><td class=\"l\"><span class=\"catbar c-en\">연예</span></td><td class=\"rr\">높음 (37→5)</td><td class=\"rr\">얇음</td><td>4</td><td><b>5</b></td><td>6</td></tr>\n<tr><td class=\"l\"><span class=\"catbar c-ec\">경제/머니</span></td><td>중간 (35→9)</td><td class=\"gg\">두꺼움</td><td>5</td><td><b>6</b></td><td>8</td></tr>\n<tr><td class=\"l\"><span class=\"catbar c-lf\">라이프</span></td><td>인기탭 없음</td><td class=\"gg\">두꺼움</td><td>5</td><td><b>7</b></td><td>8</td></tr>\n<tr style=\"background:#FAF9FE\"><td class=\"l\"><b>합계</b></td><td>—</td><td>—</td><td><b>20</b></td><td><b>25</b></td><td><b>30</b></td></tr>\n</table>\n<div class=\"note amber\" style=\"margin-top:10px\"><b>배치 로직</b> — 인기탭이 걸린 <b>스포츠·연예·경제</b>는 위험도 기준으로 우선 배치. <b>라이프는 인기탭 풀이 없지만</b> 최상위 시더(주목나무·우유엔죠리퐁 등)가 몰려 있어, <b>이들은 라이프 홈이어도 스포츠·연예 미러링 글에 답글하는 '유동 배치'</b>로 씁니다(답글은 토픽 무관). 즉 <b>홈 카테고리 ≠ 답글 대상 카테고리</b> — 얇은 연예 beat를 실력자로 메웁니다.</div>\n<div class=\"note warn\"><b>⚠ 연예가 이중으로 취약합니다.</b> 인기탭 위험도는 가장 높은데(37→5), <b>순수 시더형 인재가 가장 적습니다</b>(연예 상위는 '저자형' 위주라 답글보다 원글 중심). → 연예는 <b>가용 시더 전원 + 라이프/경제 실력자 1~2명 교차 배치</b>가 필요합니다.</div>\n</div>\n\n<!-- 후보 -->\n<div class=\"sec\">② 카테고리별 유력 후보 (유효답글 순)</div>\n<div class=\"card\">\n<div style=\"font-size:12px;color:#6E6885;margin-bottom:8px\">지표 = 8/3~9/13 누적 · <b>유효답글</b>(비크루 글에 단 답글) / <b>받은♥</b>(원글 좋아요) / <b>활동일</b>(최대 42) · 성향 <span class=\"tag t-s\">시더</span>반응특화 <span class=\"tag t-b\">균형</span> <span class=\"tag t-a\">저자</span>원글특화</div>\n\n<div class=\"sub2\"><span class=\"catbar c-ec\">경제/머니</span> <span style=\"font-weight:400;color:#6E6885;font-size:12px\">— 인재 두꺼움, 뉴스·경제 인기풀(143) 앵커</span></div>\n<table>\n<tr><th class=\"rank\">#</th><th class=\"l\">닉네임</th><th>유효답글</th><th>받은♥</th><th>활동일</th><th>성향</th></tr>\n<tr><td class=\"rank\">1</td><td class=\"l\"><b>빠꼼부부</b></td><td class=\"gg\">731</td><td>1,118</td><td>42</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">2</td><td class=\"l\"><b>경제박사동글</b></td><td class=\"gg\">659</td><td>671</td><td>42</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td class=\"rank\">3</td><td class=\"l\"><b>불주먹첫째딸</b></td><td class=\"gg\">398</td><td>500</td><td>42</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td class=\"rank\">4</td><td class=\"l\"><b>경제한입</b></td><td>319</td><td>348</td><td>38</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td class=\"rank\">5</td><td class=\"l\"><b>깅그리치</b></td><td>225</td><td>221</td><td>42</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td class=\"rank\">6</td><td class=\"l\"><b>주식사령관</b></td><td>133</td><td>192</td><td>42</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td class=\"rank\">7</td><td class=\"l\">그린애플</td><td>135</td><td>545</td><td>42</td><td><span class=\"tag t-a\">저자</span></td></tr>\n<tr><td class=\"rank\">8</td><td class=\"l\">고도띠</td><td>128</td><td>164</td><td>42</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td colspan=\"6\" style=\"text-align:left;color:#9a94ad;font-size:11.5px;padding-top:6px\">예비: 부이주민(76) · 아이언돔(69) · 눈높이테크(51) · 시엔(49) · 삶을편집하는에디나(48) · 이안의경제노트(46/♥327)</td></tr>\n</table>\n\n<div class=\"sub2\"><span class=\"catbar c-lf\">라이프</span> <span style=\"font-weight:400;color:#6E6885;font-size:12px\">— 최상위 시더 집중, 유동 배치 자원</span></div>\n<table>\n<tr><th class=\"rank\">#</th><th class=\"l\">닉네임</th><th>유효답글</th><th>받은♥</th><th>활동일</th><th>성향</th></tr>\n<tr><td class=\"rank\">1</td><td class=\"l\"><b>주목나무</b></td><td class=\"gg\">717</td><td>1,177</td><td>42</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">2</td><td class=\"l\"><b>우유엔죠리퐁</b></td><td class=\"gg\">554</td><td class=\"bb\">1,845</td><td>42</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">3</td><td class=\"l\"><b>jina</b></td><td>254</td><td>822</td><td>42</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">4</td><td class=\"l\"><b>예외일순없겠죠</b></td><td>136</td><td>711</td><td>42</td><td><span class=\"tag t-a\">저자</span></td></tr>\n<tr><td class=\"rank\">5</td><td class=\"l\"><b>릴리</b></td><td>113</td><td>251</td><td>42</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">6</td><td class=\"l\"><b>필피리</b></td><td>113</td><td>893</td><td>42</td><td><span class=\"tag t-a\">저자</span></td></tr>\n<tr><td class=\"rank\">7</td><td class=\"l\"><b>hey_jane1031</b></td><td>92</td><td>427</td><td>42</td><td><span class=\"tag t-a\">저자</span></td></tr>\n<tr><td colspan=\"6\" style=\"text-align:left;color:#9a94ad;font-size:11.5px;padding-top:6px\">예비: 맛나유주(78) · 존디(70) · 하이봄(67/♥951) · 로파이(66) · 찌니(64) · SOYOhan(56) · 쿄잉(52)</td></tr>\n</table>\n\n<div class=\"sub2\"><span class=\"catbar c-sp\">스포츠</span> <span style=\"font-weight:400;color:#6E6885;font-size:12px\">— 순수 시더형 풍부(마중물 최적), 위험도 높아 우선</span></div>\n<table>\n<tr><th class=\"rank\">#</th><th class=\"l\">닉네임</th><th>유효답글</th><th>받은♥</th><th>활동일</th><th>성향</th></tr>\n<tr><td class=\"rank\">1</td><td class=\"l\"><b>얼라라</b></td><td class=\"gg\">237</td><td>14</td><td>41</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td class=\"rank\">2</td><td class=\"l\"><b>영지</b></td><td class=\"gg\">229</td><td>442</td><td>42</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">3</td><td class=\"l\"><b>희상</b></td><td>111</td><td>356</td><td>41</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">4</td><td class=\"l\"><b>야구기록왕</b></td><td>53</td><td>194</td><td>42</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">5</td><td class=\"l\"><b>호기심천국</b></td><td>66</td><td>58</td><td>41</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td class=\"rank\">6</td><td class=\"l\"><b>야구르트</b></td><td>82</td><td>30</td><td>34</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td class=\"rank\">7</td><td class=\"l\"><b>풋티재</b></td><td>88</td><td>54</td><td>32</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td colspan=\"6\" style=\"text-align:left;color:#9a94ad;font-size:11.5px;padding-top:6px\">예비: 릴화로(56) · 옹팜나라(47) · K리그이기자(36) · 체육부장(28) · <b>탱포츠(91)</b>·<b>신규·고효율이나 활동 13일</b>(뒤늦게 합류, 관찰 대상)</td></tr>\n</table>\n\n<div class=\"sub2\"><span class=\"catbar c-en\">연예</span> <span style=\"font-weight:400;color:#6E6885;font-size:12px\">— 시더형 얇음, 아래 전원 + 교차배치 필요</span></div>\n<table>\n<tr><th class=\"rank\">#</th><th class=\"l\">닉네임</th><th>유효답글</th><th>받은♥</th><th>활동일</th><th>성향</th></tr>\n<tr><td class=\"rank\">1</td><td class=\"l\"><b>깨따루픽</b></td><td class=\"gg\">281</td><td>858</td><td>42</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">2</td><td class=\"l\"><b>꿈별</b></td><td>86</td><td>669</td><td>42</td><td><span class=\"tag t-a\">저자</span></td></tr>\n<tr><td class=\"rank\">3</td><td class=\"l\"><b>깡이yo</b></td><td>44</td><td>124</td><td>42</td><td><span class=\"tag t-b\">균형</span></td></tr>\n<tr><td class=\"rank\">4</td><td class=\"l\"><b>이뭉</b></td><td>35</td><td>317</td><td>42</td><td><span class=\"tag t-a\">저자</span></td></tr>\n<tr><td class=\"rank\">5</td><td class=\"l\"><b>쭈제비</b></td><td>35</td><td>30</td><td>40</td><td><span class=\"tag t-s\">시더</span></td></tr>\n<tr><td colspan=\"6\" style=\"text-align:left;color:#9a94ad;font-size:11.5px;padding-top:6px\">예비: 블랙하양임(31/♥180) · 은빛돌고래(28/♥395) · 익살꾼(25/♥439) · <b>교차배치</b>: 주목나무·우유엔죠리퐁·jina 중 1~2명을 연예 beat로</td></tr>\n</table>\n</div>\n\n<!-- 프로파일 노트 -->\n<div class=\"sec\">③ 두 프로파일 — 시더형 vs 저자형</div>\n<div class=\"card note info\">\n<b>시더형(반응 특화)</b> — 유효답글 많고 받은♥ 적음(예: 얼라라 237/♥14, 경제박사동글 659/♥671, 스포츠 다수). <b>마중물의 핵심.</b> 미니크루의 <b>주력(70%)</b>으로.<br>\n<b>저자형(원글 특화)</b> — 받은♥ 많고 답글 적음(예: 필피리 113/♥893, 우유엔죠리퐁 ♥1,845, 연예·라이프 상위). <b>인플루언서 티어 시드</b>이자 화제 원글 공급. <b>소수 앵커(30%)</b>로.<br>\n<b>구성 권장</b> — 25명 = 시더형 ~17 + 저자형 ~8. 시더형이 인기탭을 '살아 보이게' 유지하고, 저자형이 사람들이 반응할 원글을 깝니다.\n</div>\n\n<!-- 주의 -->\n<div class=\"sec\">④ 유의 사항</div>\n<div class=\"card note warn\">\n① <b>잠정 명단</b> — 지표 기간에 홈피드 슬롯 제거(9/3) 구간이 포함돼 최근 품앗이가 부풀어 있습니다. <b>유효답글·받은♥는 그 영향을 덜 받는 지표</b>로 골랐지만, <b>슬롯 복원 후 재산정으로 최종 확정</b> 권장.<br>\n② <b>1기 우수 크루</b>는 현재 2기 활동 데이터에 없으면 이 표에 안 잡힙니다 — 1기 alumni는 <b>별도 명단(닉네임 지정)</b>으로 합류 검토.<br>\n③ <b>성향·활동일</b>을 함께 보세요 — 유효답글만 높고 활동일 짧은 인원(예: 탱포츠 13일)은 지속성 확인 후.<br>\n④ 이 지표는 <b>공식 리그 점수와 별개</b>(마중물 적합도용). 리그·정산 평가는 기존 official_score 로직을 씁니다.\n</div>\n\n<div style=\"color:#6E6885;font-size:11.5px;text-align:center;padding:14px\">\nsuro.daily_user_detail_snapshot 8/3~9/13 · 유효답글=REPLY 중 부모글이 비크루 · 받은♥=원글 like_count 합 · 카테고리=assign_map(2기 토픽 배정) · 활동일≥5 필터 · 잠정(홈피드 복원 후 재검증) · 2026-09-14 · 대외비\n</div>\n</div>\n</body>\n</html>\n"}, "partner_crew": {"id": "partner_crew", "title": "파트너스 vs 크루 성과 비교", "tag": "전략 분석", "desc": "저효율 파트너스 축소→핵심 크루 인플루언서 전환 근거. 일반유저 유도·노출→반응 전환·인기글 진입(스포츠 슬롯 0/23)·존치/정리 후보군.", "html": "<!DOCTYPE html><html lang=ko><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\">\n<meta name=\"robots\" content=\"noindex,nofollow\">\n<title>파트너스 vs 크루 성과 비교</title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css\">\n<style>\n:root{--ink:#211C33;--purple:#6B5FC7;--pd:#4A3FA8;--paper:#F7F6FB;--surface:#fff;--lilac:#EEEBFA;--line:#E4E0F0;--muted:#6E6885;--warn:#C0392B;--good:#1E9E6A;--shadow:0 6px 24px rgba(74,63,168,.07)}\n*{margin:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,\"Apple SD Gothic Neo\",sans-serif}\nbody{background:var(--paper);color:var(--ink);line-height:1.65}\n.wrap{max-width:1060px;margin:0 auto;padding:0 22px 70px}\nheader{background:linear-gradient(150deg,#5B4FBF,#4A3FA8 55%,#3A3086);color:#fff;padding:38px 0 32px}\nheader .in{max-width:1060px;margin:0 auto;padding:0 22px}\nheader .eyebrow{letter-spacing:4px;font-size:12.5px;color:rgba(255,255,255,.72)}\nheader h1{font-size:30px;font-weight:800;margin-top:8px;text-wrap:balance}\nheader .sub{margin-top:10px;font-size:15px;color:rgba(255,255,255,.9)}\nheader .by{margin-top:14px;font-size:12.5px;color:rgba(255,255,255,.68)}\nh2.sec{font-size:21px;font-weight:800;color:var(--pd);margin:36px 0 4px}\nh2.sec .n{color:var(--purple);margin-right:8px}\n.lead{color:var(--muted);font-size:14.5px;margin:0 0 16px}\n.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}\n@media(max-widt ont-size:11px;color:var(--muted);margin-top:-6px}\n.cmp{display:flex;gap:12px;align-items:stretch;margin-top:6px}\n.cmp .box{flex:1;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}\n.cmp .box .w{font-size:12.5px;color:var(--muted);font-weight:700}.cmp .box .big{font-size:30px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}\n.cmp .box .s{font-size:11.5px;color:var(--muted);margin-top:3px}\n.cmp .arrow{display:flex;align-items:center;font-size:24px;color:var(--muted);font-weight:800}\n@media(max-width:640px){.cmp{flex-direction:column}}\ntable{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}\nth{color:var(--muted);font-size:11px;background:var(--lilac)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}\nth.l,td.l{text-align:left;white-space:normal}\n.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;color:#fff}\n.chip{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10.5px;font-weight:800}.chip.dn{background:#FBF1F0;color:#C0392B}.chip.fl{background:#FEF6E7;color:#9a6a12}\n.ins{border-left:4px solid var(--purple);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin:12px 0;box-shadow:var(--shadow)}\n.ins.warn{border-left-color:var(--warn)}.ins.good{border-left-color:var(--good)}\n.ins h4{font-size:14.5px;margin-bottom:6px;color:var(--pd)}.ins.warn h4{color:var(--warn)}.ins.good h4{color:#17603f}\n.ins ul{margin:6px 0 0;padding-left:20px}.ins li{margin:5px 0;font-size:14px}\n.act .item{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}\n.act .num2{flex:none;width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}\n.act .num2.z{background:var(--good)}\n.foot{color:var(--muted);font-size:12px;text-align:center;padding:22px}\n.scroll{overflow-x:auto}\n.note{background:#FFF7E6;border:1px solid #F0D488;border-radius:12px;padding:12px 16px;font-size:13px;color:#7A5B00;margin:12px 0;line-height:1.7}\n.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}.legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}\n.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.split{grid-template-columns:1fr}}\n</style></head><body>\n<header><div class=\"in\">\n<div class=\"eyebrow\">DAUM COMMUNITY · SEASON 2 · 제휴팀 협의 → 상위 보고</div>\n<h1>파트너스 vs 크루 성과 비교 — 예산 재배분 근거</h1>\n<div class=\"sub\">저효율 파트너스 축소 → 핵심 크루 인플루언서 전환(고정비) 전환의 데이터 근거 · 파트너스 34명(4/20~) · 크루 2기 237명(8/3~9/17)</div>\n<div class=\"by\">작성: 커뮤니티 운영 · 원천 DB(agorax: bada/nuri/suro) 실측 · 역할(MEMBER/SUPPORTERS/INFLUENCER) 실측 대조 · 기준일 2026-09-18</div>\n</div></header>\n<div class=\"wrap\">\n\n<div class=\"verdict\">\n  <span class=\"tag\">결론 · 예산 재배분 근거 충분</span>\n  <h3>일반 유저를 실제로 끌어오는 힘은 파트너스가 아니라 크루에 있습니다.</h3>\n  <p>파트너스 34명이 <b>시작(4월말)부터 지금까지 누적</b>으로 끌어낸 일반 유저 답글은 <b>6,477건</b>. 반면 크루는 <b>2기 한 기간(8/3~)만으로 14,318건</b> — 파트너스 전체 역사보다 <b>2.2배</b> 많습니다. 같은 2기 기간으로 좁히면 크루 14,318 vs 파트너스 693건으로 <b>20.7배</b> 격차입니다.</p>\n  <p>파트너스 34명 중 <b>꾸준히 활동하는 인원은 4명</b>뿐이고, 23명은 감소, 7명은 잠적·중단 상태입니다. 전기간 유도 1위 <b>송영주(1,353)</b>·2위 <b>임형철(1,204)</b>·3위 <b>피터(779)</b>는 이름값·초기 화력이 컸지만 <b>지금은 사실상 0으로 붕괴</b>했습니다 — 성과를 가른 건 이름값이 아니라 <b>꾸준함·의지</b>라는 판단이 데이터로 확인됩니다.</p>\n  <p style=\"font-size:13px;color:#456;margin-top:10px\">※ 9/3 홈피드 브릿지 슬롯 제거로 최근 외부 반응이 <b>양측 모두</b> 급감(−83%)한 상태입니다. 절대 수치는 슬롯 복원 시 회복 여지가 있으나, <b>파트너스 대비 크루의 상대 우위</b>는 슬롯과 무관하게 전 기간 일관됩니다.</p>\n</div>\n\n<h2 class=\"sec\"><span class=\"n\">01</span>파트너스 전체 활동 (4월말~현재)</h2>\n<p class=\"lead\">4/20 순차 시작 이후 지금까지. 활동량(원글)은 유지되는데 <b>일반 유저 유도는 식는</b> 구조가 핵심입니다.</p>\n<div class=\"tiles\">\n  <div class=\"tile\"><div class=\"k\">파트너스</div><div class=\"v\">34명</div><div class=\"s\">월간다음(내부) 제외</div></div>\n  <div class=\"tile\"><div class=\"k\">누적 원글</div><div class=\"v\">2,290</div><div class=\"s\">누적 조회 10,473,667</div></div>\n  <div class=\"tile\"><div class=\"k\">꾸준 / 감소 / 잠적</div><div class=\"v\">8 / 19 / 7</div><div class=\"s\">꾸준은 8명뿐</div></div>\n  <div class=\"tile\"><div class=\"k\">전기간 일반유저 유도</div><div class=\"v\">6,477</div><div class=\"s\">받은 원글 직접답글(외부)</div></div>\n</div>\n<div class=\"card\"><h3>월별 원글 작성량 <span class=\"sub\">파트너스 합계</span></h3>\n  <div class=\"bars\"><div class=\"col\"><div class=\"colbar\" style=\"height:24%;background:#6B5FC7\"><span class=\"cv\">125</span></div><div class=\"cl\">4월</div></div><div class=\"col\"><div class=\"colbar\" style=\"height:100%;background:#6B5FC7\"><span class=\"cv\">522</span></div><div class=\"cl\">5월</div></div><div class=\"col\"><div class=\"colbar\" style=\"height:95%;background:#6B5FC7\"><span class=\"cv\">496</span></div><div class=\"cl\">6월</div></div><div class=\"col\"><div class=\"colbar\" style=\"height:74%;background:#6B5FC7\"><span class=\"cv\">387</span></div><div class=\"cl\">7월</div></div><div class=\"col\"><div class=\"colbar\" style=\"height:85%;background:#6B5FC7\"><span class=\"cv\">446</span></div><div class=\"cl\">8월</div></div><div class=\"col\"><div class=\"colbar\" style=\"height:42%;background:#9b8fe0\"><span class=\"cv\">219</span></div><div class=\"cl\">9월*</div></div></div>\n  <div class=\"legend\"><span>* 9월은 9/17까지(부분)</span></div>\n  <div class=\"ins\"><h4>읽는 법</h4><ul><li>원글 물량은 5~8월 월 400~520건으로 <b>유지</b>됩니다 — 파트너스가 글을 안 쓰는 게 아닙니다.</li><li>문제는 <b>그 글이 일반 유저 반응을 못 만든다</b>는 점(섹션 02~03). 활동량이 아니라 <b>유도 효율</b>이 관건입니다.</li></ul></div></div>\n\n<h2 class=\"sec\"><span class=\"n\">02</span>실측 — 이름값·초기 화력은 지속되지 않았다</h2>\n<p class=\"lead\">원글 직접답글(depth=1)의 작성자 역할을 원천 DB에서 대조해 <b>실제 일반 유저(MEMBER)가 단 답글</b>만 집계. 전기간 누적 vs 최근 2기(8/3~)를 나란히 봅니다.</p>\n<div class=\"card\"><h3>파트너별 일반유저 유도 — 누적 vs 최근, 그리고 붕괴율 <span class=\"sub\">전기간 유도 상위 12명</span></h3>\n<div class=\"scroll\"><table>\n<thead><tr><th class=\"l\">파트너스</th><th class=\"num\">누적 조회</th><th class=\"num\">전기간 유도</th><th class=\"num\">2기 유도</th><th class=\"num\">붕괴</th><th class=\"num\">9월 원글</th><th>상태</th></tr></thead>\n<tbody><tr><td class=\"l\">송영주</td><td class=\"num\">717,560</td><td class=\"num\"><b>1,353</b></td><td class=\"num\">8</td><td class=\"num\"><span class=\"chip dn\">▼99%</span></td><td class=\"num\">10</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr><tr><td class=\"l\">임형철</td><td class=\"num\">497,000</td><td class=\"num\"><b>1,204</b></td><td class=\"num\">2</td><td class=\"num\"><span class=\"chip dn\">▼100%</span></td><td class=\"num\">8</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr><tr><td class=\"l\">피터</td><td class=\"num\">324,611</td><td class=\"num\"><b>779</b></td><td class=\"num\">3</td><td class=\"num\"><span class=\"chip dn\">▼100%</span></td><td class=\"num\">0</td><td><span class=\"pill\" style=\"background:#C0392B\">잠적/중단</span></td></tr><tr><td class=\"l\">경제왕비누</td><td class=\"num\">1,158,593</td><td class=\"num\"><b>383</b></td><td class=\"num\">145</td><td class=\"num\"><span class=\"chip dn\">▼62%</span></td><td class=\"num\">16</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr><tr><td class=\"l\">책방언니</td><td class=\"num\">212,172</td><td class=\"num\"><b>302</b></td><td class=\"num\">160</td><td class=\"num\"><span class=\"chip fl\">▼47%</span></td><td class=\"num\">14</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr><tr><td class=\"l\">낙주</td><td class=\"num\">1,144,340</td><td class=\"num\"><b>258</b></td><td class=\"num\">50</td><td class=\"num\"><span class=\"chip dn\">▼81%</span></td><td class=\"num\">33</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr><tr><td class=\"l\">박펠레</td><td class=\"num\">239,711</td><td class=\"num\"><b>199</b></td><td class=\"num\">12</td><td class=\"num\"><span class=\"chip dn\">▼94%</span></td><td class=\"num\">3</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr><tr><td class=\"l\">이정환</td><td class=\"num\">327,476</td><td class=\"num\"><b>194</b></td><td class=\"num\">37</td><td class=\"num\"><span class=\"chip dn\">▼81%</span></td><td class=\"num\">0</td><td><span class=\"pill\" style=\"background:#C0392B\">잠적/중단</span></td></tr><tr><td class=\"l\">환상감자</td><td class=\"num\">258,108</td><td class=\"num\"><b>185</b></td><td class=\"num\">45</td><td class=\"num\"><span class=\"chip dn\">▼76%</span></td><td class=\"num\">4</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr><tr><td class=\"l\">오축</td><td class=\"num\">630,021</td><td class=\"num\"><b>182</b></td><td class=\"num\">12</td><td class=\"num\"><span class=\"chip dn\">▼93%</span></td><td class=\"num\">7</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr><tr><td class=\"l\">더키앙</td><td class=\"num\">388,915</td><td class=\"num\"><b>172</b></td><td class=\"num\">25</td><td class=\"num\"><span class=\"chip dn\">▼85%</span></td><td class=\"num\">8</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr><tr><td class=\"l\">슈엔슈</td><td class=\"num\">558,370</td><td class=\"num\"><b>140</b></td><td class=\"num\">18</td><td class=\"num\"><span class=\"chip dn\">▼87%</span></td><td class=\"num\">16</td><td><span class=\"pill\" style=\"background:#9a6a12\">감소</span></td></tr></tbody></table></div>\n<div class=\"ins warn\"><h4>핵심</h4><ul>\n<li><b>송영주·임형철·피터</b> — 전기간 유도 1~3위(합 3,336건)이지만 2기엔 각 8·2·0건으로 <b>90% 이상 붕괴</b>. 초반에 반짝했다가 잠적·소진된 전형입니다.</li>\n<li>반대로 <b>경제왕비누·책방언니</b>는 누적은 중위권이어도 <b>2기에도 유도 상위(145·160)</b> — 꾸준함이 최근 성과를 만듭니다. '이름값'보다 '지속'이 예측력이 높습니다.</li>\n<li>낙주는 원글 최다(330)·조회 최상위지만 2기 유도 50건 — <b>물량 ≠ 유도</b>. 효율로 봐야 합니다.</li></ul></div></div>\n\n<h2 class=\"sec\"><span class=\"n\">03</span>파트너스 vs 크루 — 정면 비교</h2>\n<div class=\"card\"><h3>일반 유저 답글 유도 <span class=\"sub\">같은 2기 기간(8/3~9/17)</span></h3>\n<div class=\"cmp\">\n  <div class=\"box\"><div class=\"w\">파트너스 34명</div><div class=\"big\" style=\"color:var(--warn)\">693</div><div class=\"s\">전기간 누적도 6,477</div></div>\n  <div class=\"arrow\">vs</div>\n  <div class=\"box\" style=\"border-color:#1baf7a\"><div class=\"w\">크루 2기 237명</div><div class=\"big\" style=\"color:var(--good)\">14,318</div><div class=\"s\">2기 한 기간만</div></div>\n  <div class=\"arrow\">=</div>\n  <div class=\"box\" style=\"border-color:var(--purple)\"><div class=\"w\">격차</div><div class=\"big\" style=\"color:var(--pd)\">20.7배</div><div class=\"s\">크루가 압도</div></div>\n</div>\n<div class=\"ins\"><h4>1인 최고치로 봐도</h4><ul><li>파트너스 2기 최고는 <b>책방언니 160건</b>. 이를 넘는 크루가 <b>18명</b>. 크루 1위 <b>빠꼼부부(1,786건)</b> 한 명이 파트너스 <b>전체 2기(693건)의 2.6배</b>, 파트너스 전기간 1위(송영주 1,353)마저 넘어섭니다.</li></ul></div></div>\n\n<div class=\"split\">\n<div class=\"card\"><h3>자기 글 티키타카(대댓글) <span class=\"sub\">2기 · 자기 원글 스레드 내 대댓글</span></h3>\n  <div class=\"cbar\"><div class=\"cl2\" style=\"font-size:12.5px\">우유엔죠리퐁 <span style=\"color:#6B5FC7;font-size:10.5px\">크루</span></div><div class=\"ct\"><div class=\"cf\" style=\"width:100%;background:#6B5FC7\"></div></div><div class=\"cv2\">11,586</div></div><div class=\"cbar\"><div class=\"cl2\" style=\"font-size:12.5px\">주목나무 <span style=\"color:#6B5FC7;font-size:10.5px\">크루</span></div><div class=\"ct\"><div class=\"cf\" style=\"width:41%;background:#6B5FC7\"></div></div><div class=\"cv2\">4,802</div></div><div class=\"cbar\"><div class=\"cl2\" style=\"font-size:12.5px\">경제박사동글 <span style=\"color:#6B5FC7;font-size:10.5px\">크루</span></div><div class=\"ct\"><div class=\"cf\" style=\"width:30%;background:#6B5FC7\"></div></div><div class=\"cv2\">3,449</div></div><div class=\"cbar\"><div class=\"cl2\" style=\"font-size:12.5px\">빠꼼부부 <span style=\"color:#6B5FC7;font-size:10.5px\">크루</span></div><div class=\"ct\"><div class=\"cf\" style=\"width:9%;background:#6B5FC7\"></div></div><div class=\"cv2\">1,049</div></div><div class=\"cbar\"><div class=\"cl2\" style=\"font-size:12.5px\">경제왕비누 <span style=\"color:#C0392B;font-size:10.5px\">파트너</span></div><div class=\"ct\"><div class=\"cf\" style=\"width:1%;background:#C0392B\"></div></div><div class=\"cv2\">16</div></div><div class=\"cbar\"><div class=\"cl2\" style=\"font-size:12.5px\">책방언니 <span style=\"color:#C0392B;font-size:10.5px\">파트너</span></div><div class=\"ct\"><div class=\"cf\" style=\"width:1%;background:#C0392B\"></div></div><div class=\"cv2\">12</div></div><div class=\"cbar\"><div class=\"cl2\" style=\"font-size:12.5px\">송영주 <span style=\"color:#C0392B;font-size:10.5px\">파트너</span></div><div class=\"ct\"><div class=\"cf\" style=\"width:1%;background:#C0392B\"></div></div><div class=\"cv2\">11</div></div><div class=\"cbar\"><div class=\"cl2\" style=\"font-size:12.5px\">낙주 <span style=\"color:#C0392B;font-size:10.5px\">파트너</span></div><div class=\"ct\"><div class=\"cf\" style=\"width:1%;background:#C0392B\"></div></div><div class=\"cv2\">2</div></div>\n  <div class=\"ins\"><h4>글 던지고 이탈 vs 대화를 키움</h4><ul style=\"font-size:13.5px\"><li>크루는 자기 글에 달린 답글에 <b>다시 답하며 대화를 키웁니다</b>(우유엔죠리퐁 11,586·주목나무 4,802). 파트너스는 <b>거의 이탈</b>(경제왕비누 16·낙주 2). 커뮤니티를 살리는 상호작용은 크루가 만듭니다.</li></ul></div></div>\n<div class=\"card\"><h3>카테고리별 유도 효율 <span class=\"sub\">크루 2기 · 일반유저답글 / 원글</span></h3>\n  <div class=\"cbar\"><div class=\"cl2\" style=\"color:#1baf7a\">경제</div><div class=\"ct\"><div class=\"cf\" style=\"width:100%;background:#1baf7a\"></div></div><div class=\"cv2\">1.22</div><div class=\"cs\">일반유저답글 7,844 · 원글 6,419</div></div><div class=\"cbar\"><div class=\"cl2\" style=\"color:#eda100\">라이프</div><div class=\"ct\"><div class=\"cf\" style=\"width:46%;background:#eda100\"></div></div><div class=\"cv2\">0.56</div><div class=\"cs\">일반유저답글 3,432 · 원글 6,099</div></div><div class=\"cbar\"><div class=\"cl2\" style=\"color:#eb6834\">연예</div><div class=\"ct\"><div class=\"cf\" style=\"width:37%;background:#eb68 d class=\"num\" style=\"color:var(--warn)\">0.08배</td><td class=\"num\" style=\"color:var(--good)\">8.9배</td><td class=\"num\" style=\"color:var(--good)\">13.3배</td><td class=\"num\" style=\"color:var(--good)\">7.4배</td></tr>\n</tbody></table></div>\n<div class=\"ins warn\"><h4>핵심 — 노출 부족이 원인이 아니다</h4><ul>\n<li>파트너스는 <b>원글당 조회가 크루의 12.6배</b>(3,893 vs 308). 슬롯 덕에 노출은 압도적으로 많이 받습니다.</li>\n<li>그런데 <b>같은 조회당 반응은 크루의 1/9~1/13</b>. 막대한 노출이 반응으로 거의 전환되지 않습니다 — 슬롯 노출이 '수동 스크롤 노출'이라 반응 유발력이 약한 구조입니다.</li></ul></div></div>\n<div class=\"split\">\n<div class=\"card\"><h3>인기글 풀 진입 <span class=\"sub\">현재 라이브 ~298칸</span></h3>\n  <div style=\"display:flex;height:34px;border-radius:9px;overflow:hidden;margin:14px 0 6px;font-size:11px;font-weight:800;color:#fff\">\n    <div style=\"width:90.3%;background:#6B5FC7;display:flex;align-items:center;justify-content:center\">크루 90.3%</div>\n    <div style=\"width:8.1%;background:#898781;display:flex;align-items:center;justify-content:center\">외부</div>\n    <div style=\"width:1.7%;background:#C0392B;min-width:26px;display:flex;align-items:center;justify-content:center\">1.7%</div>\n  </div>\n  <div class=\"legend\"><span><span class=\"dot\" style=\"background:#6B5FC7\"></span>크루 269칸</span><span><span class=\"dot\" style=\"background:#898781\"></span>외부 24칸</span><span><span class=\"dot\" style=\"background:#C0392B\"></span>파트너스 5칸</span></div>\n  <div class=\"ins warn\"><h4>인기글엔 사실상 못 든다</h4><ul><li>전체 인기글 풀 298칸 중 <b>파트너스는 5칸(1.7%)</b>뿐. 크루가 269칸(90%)을 장악합니다. 반응이 눈덩이처럼 커지는 <b>조직적 인기글 지면에 파트너스는 거의 못 올라갑니다</b> — \"인기글로 못 올라온다\"는 진단이 데이터로 확인됩니다.</li></ul></div></div>\n<div class=\"card\"><h3>스포츠 — 슬롯이 있어도 <span class=\"sub\">스포츠탭 파트너 전용 슬롯 보유</span></h3>\n  <div class=\"cmp\" style=\"margin-top:14px\"><div class=\"box\"><div class=\"w\">스포츠 인기글 풀</div><div class=\"big\" style=\"color:var(--pd)\">23칸</div><div class=\"s\">현재 라이브</div></div><div class=\"arrow\">→</div><div class=\"box\" style=\"border-color:#1baf7a\"><div class=\"w\">크루</div><div class=\"big\" style=\"color:var(--good)\">22</div><div class=\"s\">96%</div></div><div class=\"arrow\">·</div><div class=\"box\" style=\"border-color:var(--warn)\"><div class=\"w\">파트너스</div><div class=\"big\" style=\"color:var(--warn)\">0</div><div class=\"s\">0%</div></div></div>\n  <div class=\"ins warn\"><h4>슬롯 ≠ 인기글</h4><ul><li>스포츠 파트너스는 <b>전용 슬롯</b>이 있는데도 스포츠 인기글 23칸 중 <b>0칸</b>. 전용 슬롯이 노출은 주지만 <b>조직적 인기글 순환에는 못 들어갑니다</b>. 게다가 스포츠는 카테고리 자체가 외부 전환 최저(원글당 0.48)라 이중고입니다.</li></ul></div></div>\n</div>\n<div class=\"card\"><h3>그럼 파트너스 글이 나쁜가? — 아니오 <span class=\"sub\">보이기만 하면 반응은 온다</span></h3>\n<div class=\"cmp\">\n  <div class=\"box\"><div class=\"w\">파트너 원글당 반응</div><div class=\"big\">6.5</div><div class=\"s\">좋아요+답글 · 크루 평균 5.6</div></div>\n  <div class=\"arrow\">·</div>\n  <div class=\"box\"><div class=\"w\">파트너 원글당 일반유저답글</div><div class=\"big\">1.05</div><div class=\"s\">크루 평균 0.62</div></div>\n</div>\n<div class=\"ins\"><h4>해석</h4><ul>\n<li>원글당 받은 반응·일반유저답글은 파트너스가 크루 <b>평균과 비슷하거나 오히려 높습니다</b>. 즉 <b>글이 저퀄이라 반응이 없는 게 아니라</b>, 노출이 반응·확산으로 이어지는 '지면 구조'에 못 올라타는 게 문제입니다.</li>\n<li>단, 파트너스가 이긴 건 '크루 평균'이지 '상위 크루'가 아닙니다(빠꼼부부 4.3/원글). 승격 후보 상위 크루는 여전히 파트너스를 앞섭니다.</li></ul></div></div>\n<div class=\"ins good\"><h4>\"반응이 없어서 답답하고 재미없어 이탈했나?\" — 부분적으로만 맞습니다</h4><ul>\n<li><b>구조적 답답함은 실재</b>합니다: 막대한 노출을 받고도 반응이 1/9밖에 안 돌아오고, 인기글에는 못 오르니 '열심히 써도 티가 안 나는' 경험이 반복됐을 것입니다.</li>\n<li>다만 <b>개별 이탈을 반응 부재만으로 설명하긴 어렵습니다</b> — 잠적한 파트너(피터 등)가 오히려 초기 반응이 더 높았던 경우가 많아, 이탈은 반응 피드백보다 <b>개인 의지·지속성</b>에 더 좌우됐습니다. 반응 구조를 개선하면 잔류에 도움은 되겠지만, 그것만으로 꾸준함이 보장되진 않습니다.</li></ul></div>\n\n<h2 class=\"sec\"><span class=\"n\">07</span>제언 — 예산 재배분 & 실행</h2>\n<div class=\"card act\">\n  <div class=\"item\"><div class=\"num2 z\">0</div><div><b>홈피드 슬롯 복원이 선결</b> — 9/3 제거로 외부 반응이 양측 모두 −83%. 무비용으로 유입을 되살린 뒤 파트너스 최종 정리·크루 승격 평가를 확정(현재 데이터는 슬롯 눌림 반영).</div></div>\n  <div class=\"item\"><div class=\"num2\">1</div><div><b>파트너스 즉시 정리 7명 + 재검토 15명</b> — 회수한 고정비를 크루 인플루언서 전환 재원으로. 유지 8명은 존치하되 <b>경제·재테크 카테고리 보강</b> 방향(유도 효율 최고 카테고리).</div></div>\n  <div class=\"item\"><div class=\"num2\">2</div><div><b>존치 파트너스는 '노출→반응' 구조 개선</b> — 정리와 별개로, 남기는 파트너스는 <b>슬롯 노출을 반응으로 전환</b>시키는 게 핵심입니다. ① 전용 슬롯 노출을 인기글 순환과 연결(반응 velocity 반영), ② 반응 잘 나오는 포맷(질문·투표·시사 앵글)·<b>경제/재테크</b> 카테고리 유도, ③ 파트너 글에 크루 마중물 답글을 일부 배정해 초기 반응 물꼬. 지금은 '노출은 충분한데 전환이 안 되는' 상태입니다.</div></div>\n  <div class=\"item\"><div class=\"num2\">3</div><div><b>크루 1티어 인플루언서 전환</b> — 빠꼼부부·개발하는고양이·경제한입·불주먹첫째딸·그린애플·경제박사동글·깅그리치·예외일순없겠죠 등. 「전환 로드맵」 Phase 1(마크+리테이너) → Phase 2(승격 공식화)와 연결.</div></div>\n  <div class=\"item\"><div class=\"num2\">4</div><div><b>고정비의 다음 단계 = 성과·수익 연동</b> — 양 영역 모두 고정비만으로는 장기 윈-윈이 어렵습니다. 「로드맵」 Phase 3~4의 <b>수익 쉐어(광고수익 귀속)</b>를 승격 사다리 최상단 보상으로 설계 — 지금은 지표만 확정하고 개념 합의까지.</div></div>\n  <div class=\"item\"><div class=\"num2\">5</div><div><b>제휴팀 공동 관리 지표</b> — 파트너스·크루를 동일 기준(일반유저 유도·도달 인원·꾸준함·티키타카)으로 월 단위 모니터링. 이름값이 아니라 <b>지속 성과</b>로 재계약/승격을 판단.</div></div>\n</div>\n<div class=\"ins\"><h4>한 줄 총평</h4><ul><li>제휴팀과 합의한 방향(<b>저효율 파트너스 축소 → 크루 인플루언서 전환</b>)은 데이터로 정당화됩니다. 관건은 <b>슬롯 복원으로 유입을 되살린 뒤, 이름값이 아닌 꾸준함·유도력 기준으로 인원을 재편</b>하고, 고정비를 넘어 <b>성과·수익 연동</b>으로 장기 동기를 심는 것입니다.</li></ul></div>\n\n</div>\n<div class=\"foot\">Daum 커뮤니티 2기 · 파트너스 vs 크루 성과 비교 · 내부용 대외비 · 원천 DB(agorax) 실측 · 역할 대조(MEMBER/SUPPORTERS/INFLUENCER) · 반응은 일요일 마감 스냅샷 · 9/3 슬롯 제거 구간 포함 · 2026-09-18</div>\n</body></html>"}};const IDX=[{"id": "mgmt", "title": "1차 격주 운영 리포트", "tag": "운영 총괄", "desc": "2주(8/3~8/16) 규모·참여·리텐션·카테고리·리스크·제언. 가장 흥한 글 주차별."}, {"id": "expo", "title": "크루글 노출·반응 심화 분석", "tag": "심화 분석", "desc": "조회→외부반응 전환, 외부답글 Top30, 정치·시사 분리 지표와 활용 제언."}, {"id": "wk3", "title": "3주차 크루 지표", "tag": "주간 지표", "desc": "8/17~8/23 마감. 작성량·미션·리텐션·조회반응·카테고리·가장 흥한 글(W1→W3 추이)."}, {"id": "wk4", "title": "4주차 크루 지표", "tag": "주간 지표", "desc": "8/24~8/30 마감. 외부반응 최고치·트렌드토픽·정치 의존·집중도·특이점(W1→W4)."}, {"id": "wk5", "title": "5주차 크루 지표", "tag": "주간 지표", "desc": "8/31~9/6 마감. 슬롯 제거 여파로 외부반응 급감(조회−30%·외부답글−45%), 크루답글 최고치."}, {"id": "wk6", "title": "6주차 크루 지표", "tag": "주간 지표", "desc": "9/7~9/13 마감. 슬롯 미회복 고착(조회−28%·외부답글−64%·투표−43%)·bada MCP 검증, 3차 리그 마감·리텐션 100%."}, {"id": "sim", "title": "크루 이탈 시뮬레이션", "tag": "시뮬레이션", "desc": "크루 종료 시 인기탭 카테고리별 잔존 글·반응 붕괴(-90%)·브릿지 슬롯 제거 효과(-83%) 시뮬레이션과 대응안."}, {"id": "roadmap", "title": "인플루언서 티어 전환 로드맵", "tag": "전략 로드맵", "desc": "핵심 크루→인플루언서 티어→(장기)수익 쉐어 전환의 정책·업무·일정·스펙 5단계 로드맵. 평가는 홈피드 복원 후."}, {"id": "select", "title": "소규모 마중물 크루 선발안", "tag": "선발안", "desc": "20~30명 소규모 크루의 카테고리 분배와 유력 후보(유효답글·받은좋아요·꾸준함 기준). 잠정, 홈피드 복원 후 재검증."}, {"id": "partner_crew", "title": "파트너스 vs 크루 성과 비교", "tag": "전략 분석", "desc": "저효율 파트너스 축소→핵심 크루 인플루언서 전환 근거. 일반유저 유도·노출→반응 전환·인기글 진입(스포츠 슬롯 0/23)·존치/정리 후보군."}];
